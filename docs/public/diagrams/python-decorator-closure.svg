<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="title desc"><title id="title">装饰器与闭包：定义时包装，调用时执行</title><desc id="desc">@timer 等价于定义完成后的 work = timer(work)。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="585" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">装饰器与闭包：定义时包装，调用时执行</text><text x="34" y="85" font-size="15" fill="#486573">@timer 等价于定义完成后的 work = timer(work)。</text><path d="M300 217.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 217.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 290V336H480V382" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="145" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">原函数对象</text><text x="56" y="203" font-size="14" fill="#365564">def work(x):</text><text x="56" y="226" font-size="14" fill="#365564">    return x * x</text><text x="56" y="249" font-size="14" fill="#365564">负责原来的业务计算</text><rect x="350" y="145" width="260" height="145" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">timer(work)</text><text x="366" y="203" font-size="14" fill="#365564">创建并返回 wrapper</text><text x="366" y="226" font-size="14" fill="#365564">闭包保存 work 的引用</text><text x="366" y="249" font-size="14" fill="#365564">定义阶段只完成这次绑定</text><rect x="660" y="145" width="260" height="145" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">新的 work 绑定</text><text x="676" y="203" font-size="14" fill="#365564">work → wrapper</text><text x="676" y="226" font-size="14" fill="#365564">调用 work(3) 才进入包装逻辑</text><text x="676" y="249" font-size="14" fill="#365564">包装逻辑再调用原函数</text><rect x="285" y="385" width="390" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="301" y="415" font-size="18" font-weight="650">一次实际调用</text><text x="301" y="443" font-size="14" fill="#365564">前置逻辑 → 原函数 → 收尾逻辑</text><text x="301" y="466" font-size="14" fill="#365564">计时、日志、鉴权或重试可在这里发生</text><text x="34" y="555" font-size="14" fill="#486573">装饰器返回值通常是包装函数，也可以是其他可调用对象。</text></g></svg>
e-width="2.4" fill="none"  marker-end="url(#arr)"/><path d="M615 210L655 210" stroke="#16895b" stroke-width="2.4" fill="none"  marker-end="url(#arr)"/><rect x="184" y="329" width="270" height="72" rx="12" fill="#f0e7ff" stroke="#16895b" stroke-width="1.7"/><text x="319" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#17324b">Ray：分配 / 放置资源</text><text x="319" y="384" font-size="13" font-weight="450" text-anchor="middle" fill="#17324b">启动与监控 Worker</text><rect x="542" y="329" width="275" height="72" rx="12" fill="#e4f8f6" stroke="#16895b" stroke-width="1.7"/><text x="679.5" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#17324b">vLLM：GPU 计算与通信</text><text x="679.5" y="384" font-size="13" font-weight="450" text-anchor="middle" fill="#17324b">初始化模型并行 / NCCL</text><path d="M468 256L335 317" stroke="#16895b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><path d="M800 257L685 319" stroke="#16895b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="480" y="451" font-size="14" font-weight="450" text-anchor="middle" fill="#17324b">Ray 并不替代 vLLM 的 Attention / TP Kernel，也不直接执行 GPU NCCL AllReduce</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">TP 切 Head，CP 切 Token</title><desc id="desc">标准 MHA 的示例布局为 [B, S, N_h, D_h]；两种切法均不缩小单个 Head 的宽度。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="410" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">TP 切 Head，CP 切 Token</text><text x="34" y="85" font-size="15" fill="#486573">标准 MHA 的示例布局为 [B, S, N_h, D_h]；两种切法均不缩小单个 Head 的宽度。</text><rect x="50" y="145" width="390" height="155" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="175" font-size="18" font-weight="650">TP：张量并行</text><text x="66" y="203" font-size="14" fill="#365564">每卡一组完整 Attention Heads</text><text x="66" y="226" font-size="14" fill="#365564">局部 Q / K / V：</text><text x="66" y="249" font-size="14" fill="#365564">[B, S, N_h / T, D_h]</text><text x="66" y="272" font-size="14" fill="#365564">处理完整序列，投影后归并部分和</text><rect x="520" y="145" width="390" height="155" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="175" font-size="18" font-weight="650">CP：上下文并行</text><text x="536" y="203" font-size="14" fill="#365564">每卡一段 Token</text><text x="536" y="226" font-size="14" fill="#365564">局部 Q / K / V：</text><text x="536" y="249" font-size="14" fill="#365564">[B, S / C, N_h, D_h]</text><text x="536" y="272" font-size="14" fill="#365564">Attention 还需跨卡获取 KV 贡献</text><text x="34" y="380" font-size="14" fill="#486573">TP 与 CP 可以组合使用；GQA / MQA 的 KV Head 分布或复制取决于具体实现。</text></g></svg>
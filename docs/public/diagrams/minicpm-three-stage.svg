<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">MiniCPM-o 4.5：三阶段语音生成</title><desc id="desc">这是服务实现的阶段拆分，与模型的全双工时间轴是两个观察角度。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">MiniCPM-o 4.5：三阶段语音生成</text><text x="34" y="85" font-size="15" fill="#486573">这是服务实现的阶段拆分，与模型的全双工时间轴是两个观察角度。</text><path d="M300 212.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 212.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 280V392" fill="none" stroke="#456c7c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="135" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Thinker</text><text x="56" y="203" font-size="14" fill="#365564">多模态理解与语言生成</text><text x="56" y="226" font-size="14" fill="#365564">产出文本 / Hidden States</text><text x="56" y="249" font-size="14" fill="#365564">携带请求与声音条件</text><rect x="350" y="145" width="260" height="135" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Talker</text><text x="366" y="203" font-size="14" fill="#365564">基于语言条件生成音频表征</text><text x="366" y="226" font-size="14" fill="#365564">输出 Codec Tokens / Chunk</text><text x="366" y="249" font-size="14" fill="#365564">遵循该版本的音频生成语义</text><rect x="660" y="145" width="260" height="135" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Code2Wav</text><text x="676" y="203" font-size="14" fill="#365564">将 Codec 表征转换成波形</text><text x="676" y="226" font-size="14" fill="#365564">CFM / 声码器等恢复步骤</text><text x="676" y="249" font-size="14" fill="#365564">输出音频 Chunk</text><rect x="235" y="395" width="490" height="120" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="251" y="425" font-size="18" font-weight="650">跨 Stage 流式交付</text><text x="251" y="453" font-size="14" fill="#365564">按 Request ID 关联 Chunk 与各阶段状态</text><text x="251" y="476" font-size="14" fill="#365564">处理分块顺序、背压、结束和缓存清理</text><text x="251" y="499" font-size="14" fill="#365564">Talker 与 Code2Wav 可按 Chunk 形成重叠</text><text x="34" y="570" font-size="14" fill="#486573">较早实现也有 Thinker → Talker+Token2Wav 两阶段形态；比较性能应固定版本。</text></g></svg>
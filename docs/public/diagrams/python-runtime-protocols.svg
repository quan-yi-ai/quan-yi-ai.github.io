<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Python：四种不同的状态边界</title><desc id="desc">这些机制可组合使用，但彼此不是前后依赖的执行阶段。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="550" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">Python：四种不同的状态边界</text><text x="34" y="85" font-size="15" fill="#486573">这些机制可组合使用，但彼此不是前后依赖的执行阶段。</text><rect x="50" y="145" width="390" height="125" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="175" font-size="18" font-weight="650">Closure</text><text x="66" y="203" font-size="14" fill="#365564">函数引用词法环境</text><text x="66" y="226" font-size="14" fill="#365564">内部函数仍可访问捕获的变量</text><rect x="520" y="145" width="390" height="125" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="175" font-size="18" font-weight="650">Generator</text><text x="536" y="203" font-size="14" fill="#365564">保存暂停的执行帧与局部状态</text><text x="536" y="226" font-size="14" fill="#365564">next / send 推进到下一次 yield</text><rect x="50" y="335" width="390" height="125" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="66" y="365" font-size="18" font-weight="650">Context Manager</text><text x="66" y="393" font-size="14" fill="#365564">__enter__ / __exit__</text><text x="66" y="416" font-size="14" fill="#365564">规定资源作用域与异常处理</text><rect x="520" y="335" width="390" height="125" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="536" y="365" font-size="18" font-weight="650">Async Context Manager</text><text x="536" y="393" font-size="14" fill="#365564">__aenter__ / __aexit__</text><text x="536" y="416" font-size="14" fill="#365564">进入与退出过程都可以等待 I/O</text><text x="34" y="520" font-size="14" fill="#486573">装饰器可通过闭包保留原函数；生成器也可借助 contextlib 实现上下文协议。</text></g></svg>
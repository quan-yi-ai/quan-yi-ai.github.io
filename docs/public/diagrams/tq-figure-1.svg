<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">TransferQueue：任务通过样本字段交接数据</title><desc id="desc">Rollout、Reward 与 Trainer 各自访问共享数据层，而不是彼此直接绑定。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="610" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">TransferQueue：任务通过样本字段交接数据</text><text x="34" y="85" font-size="15" fill="#486573">Rollout、Reward 与 Trainer 各自访问共享数据层，而不是彼此直接绑定。</text><path d="M170 255V330H330V397" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="180" y="300" font-size="13" fill="#456c7c">读 / 写</text><path d="M480 255V397" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="495" y="335" font-size="13" fill="#456c7c">读 / 写</text><path d="M790 400H850V310H790V258" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="855" y="355" font-size="13" fill="#456c7c">读取</text><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Rollout</text><text x="56" y="203" font-size="14" fill="#365564">读取 Prompt</text><text x="56" y="226" font-size="14" fill="#365564">写入 Response / Logprobs</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Reward / Reference</text><text x="366" y="203" font-size="14" fill="#365564">读取所需 Prompt / Response</text><text x="366" y="226" font-size="14" fill="#365564">写入 Reward / Ref Logprob</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Trainer</text><text x="676" y="203" font-size="14" fill="#365564">读取所需字段就绪的 Batch</text><text x="676" y="226" font-size="14" fill="#365564">计算 Advantage、Loss 与更新</text><rect x="170" y="400" width="620" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="186" y="430" font-size="18" font-weight="650">TransferQueue：Metadata + Payload</text><text x="186" y="458" font-size="14" fill="#365564">按 Global Index 组织样本字段；记录各任务的生产 / 消费状态</text><text x="186" y="481" font-size="14" fill="#365564">数据面负责保存和交付字段；主控管理 Iteration 与回收边界</text><text x="34" y="580" font-size="14" fill="#486573">图中箭头表示访问关系；实际请求可双向传输，更新模型权重走另一条协议。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Rollout 到 Trainer：异步数据交接</title><desc id="desc">生产端按阶段补齐样本；消费端按就绪字段取数据</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#16895b" fill="none" stroke-width="1.5"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#2faf84" opacity=".08"/></pattern></defs><rect width="960" height="480" rx="16" fill="url(#bg)"/><rect width="960" height="480" rx="16" fill="url(#dots)"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="37" y="42" fill="#087f55" font-size="13" letter-spacing="2">TRANSFERQUEUE · 01</text><text x="37" y="86" fill="#17324b" font-weight="760" font-size="26">Rollout 到 Trainer：异步数据交接</text><text x="37" y="116" fill="#17324b" font-size="14">生产端按阶段补齐样本；消费端按就绪字段取数据</text><rect x="34" y="174" width="184" height="78" rx="10" fill="#dcf8e9" stroke="#16895b" stroke-width="1.6"/><text x="126" y="200" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#17324b">Rollout</text><text x="126" y="223" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="12" fill="#17324b">生成 Response</text><rect x="272" y="174" width="184" height="78" rx="10" fill="#e1efff" stroke="#16895b" stroke-width="1.6"/><text x="364" y="200" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#17324b">TransferQueue</text><text x="364" y="223" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="12" fill="#17324b">按样本存放字段</text><rect x="510" y="174" width="184" height="78" rx="10" fill="#fff0d8" stroke="#16895b" stroke-width="1.6"/><text x="602" y="200" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#17324b">Reward</text><text x="602" y="223" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="12" fill="#17324b">补齐分数</text><rect x="748" y="174" width="184" height="78" rx="10" fill="#f0e7ff" stroke="#16895b" stroke-width="1.6"/><text x="840" y="200" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#17324b">Trainer</text><text x="840" y="223" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif" font-size="12" fill="#17324b">读取训练 Batch</text><path d="M223 213 L261 213" fill="none" stroke="#16895b" stroke-width="2.3" marker-end="url(#arr)"/><path d="M461 213 L499 213" fill="none" stroke="#16895b" stroke-width="2.3" marker-end="url(#arr)"/><path d="M699 213 L737 213" fill="none" stroke="#16895b" stroke-width="2.3" marker-end="url(#arr)"/><rect x="62" y="301" width="834" height="44" rx="9" fill="#e4f8f6" stroke="#16895b"/><text x="479" y="329" font-size="15" fill="#17324b" text-anchor="middle">按字段生产 / 状态追踪 / 微批消费 · 任务之间无需直接绑定对端地址</text><line x1="37" y1="448" x2="923" y2="448" stroke="#16895b" opacity=".7"/><text x="37" y="466" font-size="11" fill="#476078">教学示意 · 表示逻辑关系，不代表固定进程数或网络拓扑</text></g></svg>
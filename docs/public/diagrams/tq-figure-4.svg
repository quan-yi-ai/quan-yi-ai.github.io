<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc"><title id="title">算法编排：显式传递与字段就绪驱动</title><desc id="desc">两条路径共享算法依赖，但由不同的边界负责计算任务间的数据交付。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="710" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">算法编排：显式传递与字段就绪驱动</text><text x="34" y="85" font-size="15" fill="#486573">两条路径共享算法依赖，但由不同的边界负责计算任务间的数据交付。</text><path d="M245 240V278.5H245V317" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M245 420V458.5H245V497" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 240V278.5H715V317" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 420V458.5H715V497" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="140" width="390" height="100" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="170" font-size="18" font-weight="650">显式传递：DataLoader</text><text x="66" y="198" font-size="14" fill="#365564">提供本轮 Prompts</text><rect x="50" y="320" width="390" height="100" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="66" y="350" font-size="18" font-weight="650">Actor Rollout</text><text x="66" y="378" font-size="14" fill="#365564">生成 Responses 后交给后续任务</text><rect x="50" y="500" width="390" height="120" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="66" y="530" font-size="18" font-weight="650">Ref / Actor / Reward → Update</text><text x="66" y="558" font-size="14" fill="#365564">产生训练所需字段</text><text x="66" y="581" font-size="14" fill="#365564">再将这些字段交给 Actor Update</text><rect x="520" y="140" width="390" height="100" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="536" y="170" font-size="18" font-weight="650">字段就绪：DataLoader → TQ</text><text x="536" y="198" font-size="14" fill="#365564">向 TransferQueue 写入本轮 Prompts</text><rect x="520" y="320" width="390" height="100" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="536" y="350" font-size="18" font-weight="650">计算任务 ↔ TransferQueue</text><text x="536" y="378" font-size="14" fill="#365564">读取输入就绪字段，写回自己的产出</text><rect x="520" y="500" width="390" height="120" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="530" font-size="18" font-weight="650">Actor Update ↔ TransferQueue</text><text x="536" y="558" font-size="14" fill="#365564">按 Microbatch 请求训练字段</text><text x="536" y="581" font-size="14" fill="#365564">主控管理迭代结束和旧数据逐出</text><text x="34" y="680" font-size="14" fill="#486573">概念对照：字段就绪驱动不意味着消除算法依赖，也不自动保证 On-policy 条件。</text></g></svg>
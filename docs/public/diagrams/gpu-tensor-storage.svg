<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Tensor、Storage、虚拟地址与物理显存</title><desc id="desc">Tensor 的元数据、底层存储与设备物理资源属于不同层次。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">Tensor、Storage、虚拟地址与物理显存</text><text x="34" y="85" font-size="15" fill="#486573">Tensor 的元数据、底层存储与设备物理资源属于不同层次。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V308.5H790V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="800" y="320" font-size="13" fill="#456c7c">地址映射</text><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Tensor 对象</text><text x="56" y="203" font-size="14" fill="#365564">shape / dtype / stride</text><text x="56" y="226" font-size="14" fill="#365564">视图还可包含 storage_offset</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Storage</text><text x="366" y="203" font-size="14" fill="#365564">字节容量与底层 data_ptr</text><text x="366" y="226" font-size="14" fill="#365564">多个 Tensor 可能共享 Storage</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">GPU 虚拟地址</text><text x="676" y="203" font-size="14" fill="#365564">设备代码使用的地址</text><text x="676" y="226" font-size="14" fill="#365564">本身不是物理显存页</text><rect x="660" y="365" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="395" font-size="18" font-weight="650">GPU 物理分配</text><text x="676" y="423" font-size="14" fill="#365564">由地址映射对应</text><text x="676" y="446" font-size="14" fill="#365564">释放变量不一定释放缓存</text><text x="34" y="530" font-size="14" fill="#486573">Tensor.data_ptr() 可受 storage_offset 影响；不能总与 Storage 的起始地址等同。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="t d"><title id="t">ObjectRef：用依赖关系组织远程计算</title><desc id="d">传递 ObjectRef 建立数据依赖，不等于每次调用都立刻复制对象</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1711"/><stop offset="1" stop-color="#14241b"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#92efb1" fill="none" stroke-width="1.6"/></marker></defs><rect width="960" height="495" rx="18" fill="url(#bg)"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="40" y="42" font-size="12" font-weight="700" text-anchor="start" fill="#83f3a8">RAY / AI SYSTEMS</text><text x="40" y="81" font-size="25" font-weight="700" text-anchor="start" fill="#ecfff2">ObjectRef：用依赖关系组织远程计算</text><text x="40" y="114" font-size="14" font-weight="450" text-anchor="start" fill="#a4c5af">传递 ObjectRef 建立数据依赖，不等于每次调用都立刻复制对象</text><rect x="46" y="191" width="224" height="78" rx="12" fill="#192e23" stroke="#5a8c68" stroke-width="1.7"/><text x="158" y="221" font-size="17" font-weight="700" text-anchor="middle" fill="#f3fff6">Task A</text><text x="158" y="246" font-size="13" font-weight="450" text-anchor="middle" fill="#abd7bb">produce data</text><rect x="362" y="191" width="232" height="78" rx="12" fill="#214a34" stroke="#8ff5ae" stroke-width="1.7"/><text x="478" y="221" font-size="17" font-weight="700" text-anchor="middle" fill="#f3fff6">ObjectRef</text><text x="478" y="246" font-size="13" font-weight="450" text-anchor="middle" fill="#abd7bb">immutable object handle</text><rect x="690" y="191" width="224" height="78" rx="12" fill="#192e23" stroke="#5a8c68" stroke-width="1.7"/><text x="802" y="221" font-size="17" font-weight="700" text-anchor="middle" fill="#f3fff6">Task B</text><text x="802" y="246" font-size="13" font-weight="450" text-anchor="middle" fill="#abd7bb">consume result</text><path d="M279 230L349 230" stroke="#92efb1" stroke-width="2.4" fill="none"  marker-end="url(#arr)"/><path d="M604 230L680 230" stroke="#92efb1" stroke-width="2.4" fill="none"  marker-end="url(#arr)"/><rect x="344" y="338" width="267" height="72" rx="12" fill="#192e23" stroke="#5a8c68" stroke-width="1.7"/><text x="477.5" y="368" font-size="17" font-weight="700" text-anchor="middle" fill="#f3fff6">Node Object Store</text><text x="477.5" y="393" font-size="13" font-weight="450" text-anchor="middle" fill="#abd7bb">对象可能驻留其他节点</text><path d="M480 281L480 327" stroke="#90a99b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="480" y="450" font-size="14" font-weight="450" text-anchor="middle" fill="#b9d9c4">顶层 ObjectRef 参数可建立自动依赖；ray.get() 才主动获取结果</text></g></svg>
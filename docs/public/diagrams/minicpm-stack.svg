<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="title desc"><title id="title">vLLM、vLLM-Omni 与 Ascend 的职责</title><desc id="desc">模型阶段编排、通用推理运行时与设备适配属于不同层面。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="585" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">vLLM、vLLM-Omni 与 Ascend 的职责</text><text x="34" y="85" font-size="15" fill="#486573">模型阶段编排、通用推理运行时与设备适配属于不同层面。</text><path d="M440 207.5H517" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 270V318.5H715V367" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 270V315H245V367" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="145" width="390" height="125" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="175" font-size="18" font-weight="650">vLLM-Omni</text><text x="66" y="203" font-size="14" fill="#365564">模型适配与多 Stage 编排</text><text x="66" y="226" font-size="14" fill="#365564">请求关联、Chunk 路由与跨阶段交付</text><rect x="520" y="145" width="390" height="125" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="175" font-size="18" font-weight="650">vLLM</text><text x="536" y="203" font-size="14" fill="#365564">调度与模型执行的通用骨架</text><text x="536" y="226" font-size="14" fill="#365564">Worker / Executor / Model Runner</text><rect x="50" y="370" width="390" height="125" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="66" y="400" font-size="18" font-weight="650">vLLM-Ascend</text><text x="66" y="428" font-size="14" fill="#365564">Ascend NPU 平台与后端适配</text><text x="66" y="451" font-size="14" fill="#365564">设备算子、执行环境与相关图能力</text><rect x="520" y="370" width="390" height="125" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="536" y="400" font-size="18" font-weight="650">CUDA 等其他设备路径</text><text x="536" y="428" font-size="14" fill="#365564">依照所选硬件和后端运行</text><text x="536" y="451" font-size="14" fill="#365564">不是所有部署都经过 vLLM-Ascend</text><text x="34" y="555" font-size="14" fill="#486573">上图表示职责与适配关系；Stage 数、进程数和设备数需要由部署配置分别确定。</text></g></svg>
786" y="368" font-size="13" text-anchor="middle" fill="#43647a">cancel + cleanup</text><path d="M405 232L175 299" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><path d="M480 232L480 299" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><path d="M555 232L784 299" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><text x="480" y="444" text-anchor="middle" font-size="14" fill="#4a6174">非取消异常使兄弟任务取消；退出时等待收尾并抛出 ExceptionGroup</text></g></svg>
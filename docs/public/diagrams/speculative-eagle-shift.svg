<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">原始 EAGLE：特征序列与 Token 错开一步</title><desc id="desc">示例前缀为 I love；目标模型先给出下一 Token cats。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">原始 EAGLE：特征序列与 Token 错开一步</text><text x="34" y="85" font-size="15" fill="#486573">示例前缀为 I love；目标模型先给出下一 Token cats。</text><path d="M440 197.5H517" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 260V311H715V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M520 427.5H443" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="135" width="390" height="125" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="165" font-size="18" font-weight="650">目标模型 Prefill</text><text x="66" y="193" font-size="14" fill="#365564">得到前缀末尾特征 f_love</text><text x="66" y="216" font-size="14" fill="#365564">LM Head(f_love) 采样 cats</text><text x="66" y="239" font-size="14" fill="#365564">cats 的身份成为下一特征预测条件</text><rect x="520" y="135" width="390" height="125" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="165" font-size="18" font-weight="650">草稿第 1 步</text><text x="536" y="193" font-size="14" fill="#365564">[f_love ; Emb(cats)] → FC + Decoder</text><text x="536" y="216" font-size="14" fill="#365564">预测 f_cats，再经共享 LM Head</text><text x="536" y="239" font-size="14" fill="#365564">采样后续 Token eat</text><rect x="520" y="365" width="390" height="125" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="536" y="395" font-size="18" font-weight="650">草稿第 2 步</text><text x="536" y="423" font-size="14" fill="#365564">[预测的 f_cats ; Emb(eat)]</text><text x="536" y="446" font-size="14" fill="#365564">预测 f_eat → LM Head → pizza</text><text x="536" y="469" font-size="14" fill="#365564">Token 已知值显式约束下一特征</text><rect x="50" y="365" width="390" height="125" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="395" font-size="18" font-weight="650">序列与树形候选</text><text x="66" y="423" font-size="14" fill="#365564">上面仅画一条草稿分支</text><text x="66" y="446" font-size="14" fill="#365564">实际头会读取特征和偏移 Token 历史</text><text x="66" y="469" font-size="14" fill="#365564">树注意力也可一次处理多条分支</text><text x="34" y="546" font-size="14" fill="#486573">不能把 f_love 与 Emb(love) 配在一起冒充偏移条件；EAGLE 后续版本结构另有变化。</text><text x="34" y="570" font-size="14" fill="#486573">依据 EAGLE 原论文 §3.1 / §3.2；图中省略完整历史序列与注意力细节。</text></g></svg>
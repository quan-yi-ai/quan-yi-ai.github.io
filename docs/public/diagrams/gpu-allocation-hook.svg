<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">内存分配 Hook：拦截边界取决于接入模式</title><desc id="desc">缓存命中时，创建 Tensor 不一定触发底层 CUDA 物理分配。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">内存分配 Hook：拦截边界取决于接入模式</text><text x="34" y="85" font-size="15" fill="#486573">缓存命中时，创建 Tensor 不一定触发底层 CUDA 物理分配。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 255V308.5H480V362" fill="none" stroke="#456c7c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Python Tensor 操作</text><text x="56" y="203" font-size="14" fill="#365564">torch.empty / 模型加载</text><text x="56" y="226" font-size="14" fill="#365564">向分配器请求所需空间</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">PyTorch Allocator</text><text x="366" y="203" font-size="14" fill="#365564">缓存路径可复用已有 Block</text><text x="366" y="226" font-size="14" fill="#365564">自定义分配器模式接入此层</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">CUDA Driver / Runtime</text><text x="676" y="203" font-size="14" fill="#365564">缓存未满足时的底层调用</text><text x="676" y="226" font-size="14" fill="#365564">Preload 仅拦截支持的符号</text><rect x="285" y="365" width="390" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="301" y="395" font-size="18" font-weight="650">TMS 管理受支持分配</text><text x="301" y="423" font-size="14" fill="#365564">跟踪受管地址与备份配置</text><text x="301" y="446" font-size="14" fill="#365564">具体覆盖范围由接入模式和版本决定</text><text x="34" y="530" font-size="14" fill="#486573">Hook 是调用拦截或替换机制，不是一种 GPU 内存类型。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" role="img" aria-labelledby="title desc"><title id="title">Agentic RL：动作、观察与轨迹</title><desc id="desc">Policy 产生动作，环境返回新的观察；终止后按轨迹计算反馈。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="605" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">Agentic RL：动作、观察与轨迹</text><text x="34" y="85" font-size="15" fill="#486573">Policy 产生动作，环境返回新的观察；终止后按轨迹计算反馈。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 145V120H480V142" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="565" y="113" font-size="13" fill="#456c7c">下一轮观察</text><path d="M480 255V331H480V407" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><text x="492" y="340" font-size="13" fill="#456c7c">记录每轮</text><path d="M610 465H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Prompt / Observation</text><text x="56" y="203" font-size="14" fill="#365564">初始任务与当前上下文</text><text x="56" y="226" font-size="14" fill="#365564">包含历史对话和工具结果</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Policy</text><text x="366" y="203" font-size="14" fill="#365564">生成 Action / Tool Call</text><text x="366" y="226" font-size="14" fill="#365564">只对策略动作建立训练 Mask</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Tool / Environment</text><text x="676" y="203" font-size="14" fill="#365564">执行工具并产生 Observation</text><text x="676" y="226" font-size="14" fill="#365564">环境状态随动作变化</text><rect x="350" y="410" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="366" y="440" font-size="18" font-weight="650">Trajectory</text><text x="366" y="468" font-size="14" fill="#365564">按 Turn 记录动作和观察</text><text x="366" y="491" font-size="14" fill="#365564">保留版本、边界和终止状态</text><rect x="660" y="410" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="676" y="440" font-size="18" font-weight="650">Reward</text><text x="676" y="468" font-size="14" fill="#365564">终局或阶段性反馈</text><text x="676" y="491" font-size="14" fill="#365564">交给训练端构造目标</text><text x="34" y="575" font-size="14" fill="#486573">环境观察参与下一轮输入，但不应直接被当作策略采样出的 Action Token。</text></g></svg>
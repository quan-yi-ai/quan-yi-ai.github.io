<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">DeepSeek-V3 MTP：预测深度与 Token 对齐</title><desc id="desc">固定主序列位置 i；第 k 个额外模块预测更远一个 Token。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="590" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">DeepSeek-V3 MTP：预测深度与 Token 对齐</text><text x="34" y="85" font-size="15" fill="#486573">固定主序列位置 i；第 k 个额外模块预测更远一个 Token。</text><path d="M300 200H325V317H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M300 410H325V317H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 317.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">上一深度表示</text><text x="56" y="203" font-size="14" fill="#365564">h_i^(k−1)</text><text x="56" y="226" font-size="14" fill="#365564">k=1 时来自主干模型</text><rect x="40" y="355" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="56" y="385" font-size="18" font-weight="650">偏移后的 Token 嵌入</text><text x="56" y="413" font-size="14" fill="#365564">Emb(t_(i+k))</text><text x="56" y="436" font-size="14" fill="#365564">训练时使用真实序列</text><rect x="350" y="245" width="260" height="145" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="366" y="275" font-size="18" font-weight="650">归一化与投影</text><text x="366" y="303" font-size="14" fill="#365564">分别 RMSNorm 后拼接</text><text x="366" y="326" font-size="14" fill="#365564">经 M_k 投影</text><text x="366" y="349" font-size="14" fill="#365564">输入第 k 个 Transformer Block</text><rect x="660" y="245" width="260" height="145" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="275" font-size="18" font-weight="650">当前深度 h_i^k</text><text x="676" y="303" font-size="14" fill="#365564">通过共享输出头</text><text x="676" y="326" font-size="14" fill="#365564">预测 t_(i+k+1)</text><text x="676" y="349" font-size="14" fill="#365564">不是独立无条件的未来预测头</text><text x="34" y="536" font-size="14" fill="#486573">主干 h_i^0 预测 t_(i+1)；MTP 深度 k 与推理时的草稿步数应分开标记。</text><text x="34" y="560" font-size="14" fill="#486573">依据 DeepSeek-V3 §2.2；推理起草时需以已知或候选 Token 构造相应条件。</text></g></svg>
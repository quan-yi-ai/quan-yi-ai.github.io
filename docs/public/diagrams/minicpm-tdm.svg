<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">TDM 与主动交互：输入和输出共用时间轴</title><desc id="desc">Omni-Flow 对齐音视频流；1 Hz 的主动交互判断不等于所有模态只按 1 秒采样。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">TDM 与主动交互：输入和输出共用时间轴</text><text x="34" y="85" font-size="15" fill="#486573">Omni-Flow 对齐音视频流；1 Hz 的主动交互判断不等于所有模态只按 1 秒采样。</text><path d="M300 212.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 212.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="135" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">持续输入</text><text x="56" y="203" font-size="14" fill="#365564">视频帧与音频片段持续到达</text><text x="56" y="226" font-size="14" fill="#365564">多模态 Encoder 产生表示</text><text x="56" y="249" font-size="14" fill="#365564">按时间信息组织输入组</text><rect x="350" y="145" width="260" height="135" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">LLM / 交互控制</text><text x="366" y="203" font-size="14" fill="#365564">在共享时序中消费输入</text><text x="366" y="226" font-size="14" fill="#365564">约每秒判断是否主动发言</text><text x="366" y="249" font-size="14" fill="#365564">按任务决定说话或继续监听</text><rect x="660" y="145" width="260" height="135" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">流式输出</text><text x="676" y="203" font-size="14" fill="#365564">文本 / Speak 或 Listen 控制</text><text x="676" y="226" font-size="14" fill="#365564">交错式语音解码</text><text x="676" y="249" font-size="14" fill="#365564">恢复连续波形</text><rect x="235" y="405" width="490" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="251" y="435" font-size="18" font-weight="650">全双工</text><text x="251" y="463" font-size="14" fill="#365564">模型输出音频的同时仍可接收新的音视频输入</text><text x="251" y="486" font-size="14" fill="#365564">发言控制频率、输入切片与音频生成粒度须分别理解</text><text x="34" y="570" font-size="14" fill="#486573">依据 MiniCPM-o 4.5 官方模型说明：TDM 流对齐与主动交互机制。</text></g></svg>
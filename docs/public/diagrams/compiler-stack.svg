<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">torch.compile：从 Python 到目标代码</title><desc id="desc">以常见默认编译后端为例；训练与推理的图处理路径可能不同。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="740" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">torch.compile：从 Python 到目标代码</text><text x="34" y="85" font-size="15" fill="#486573">以常见默认编译后端为例；训练与推理的图处理路径可能不同。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V308.5H790V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 475V511H715V547" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 475V510H245V547" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Python 程序</text><text x="56" y="203" font-size="14" fill="#365564">Tensor 操作与控制流</text><text x="56" y="226" font-size="14" fill="#365564">支持的区域进入图捕获</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">TorchDynamo</text><text x="366" y="203" font-size="14" fill="#365564">生成 FX Graph</text><text x="366" y="226" font-size="14" fill="#365564">建立 Guards 与复用条件</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">AOTAutograd</text><text x="676" y="203" font-size="14" fill="#365564">分解与前反向图处理</text><text x="676" y="226" font-size="14" fill="#365564">训练时决定保存 / 重算</text><rect x="660" y="365" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="395" font-size="18" font-weight="650">TorchInductor</text><text x="676" y="423" font-size="14" fill="#365564">IR / Fusion / Scheduling</text><text x="676" y="446" font-size="14" fill="#365564">选择与生成目标代码</text><rect x="50" y="550" width="390" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="580" font-size="18" font-weight="650">GPU 路径</text><text x="66" y="608" font-size="14" fill="#365564">Triton、模板或外部库 Kernel</text><text x="66" y="631" font-size="14" fill="#365564">不是每个操作都变成 Triton</text><rect x="520" y="550" width="390" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="580" font-size="18" font-weight="650">CPU 与其他路径</text><text x="536" y="608" font-size="14" fill="#365564">C++ / 外部算子等</text><text x="536" y="631" font-size="14" fill="#365564">取决于后端与设备支持</text><text x="34" y="710" font-size="14" fill="#486573">Guard 未满足可能触发重编译；Graph Break 则将执行拆成多个区域。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="705" viewBox="0 0 960 705" role="img" aria-labelledby="title desc"><title id="title">Selective CPU Offload：按训练状态分流</title><desc id="desc">在安全的 Sleep 边界分类，Wake 时恢复必须保留的状态并重建临时缓冲区。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="705" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">Selective CPU Offload：按训练状态分流</text><text x="34" y="85" font-size="15" fill="#486573">在安全的 Sleep 边界分类，Wake 时恢复必须保留的状态并重建临时缓冲区。</text><path d="M480 240V281H245V322" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 240V281H715V322" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M245 440V476H245V512" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 440V476H715V512" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="285" y="130" width="390" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="301" y="160" font-size="18" font-weight="650">Megatron 训练状态</text><text x="301" y="188" font-size="14" fill="#365564">先完成 GPU 工作与必要同步</text><text x="301" y="211" font-size="14" fill="#365564">确认哪些状态仍被引用</text><rect x="50" y="325" width="390" height="115" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="66" y="355" font-size="18" font-weight="650">必须保留</text><text x="66" y="383" font-size="14" fill="#365564">参数、FP32 Master 参数</text><text x="66" y="406" font-size="14" fill="#365564">Adam 一阶与二阶矩等优化器状态</text><rect x="520" y="325" width="390" height="115" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="536" y="355" font-size="18" font-weight="650">可重建</text><text x="536" y="383" font-size="14" fill="#365564">已用完的梯度缓冲区</text><text x="536" y="406" font-size="14" fill="#365564">MoE Dispatcher 等临时缓存</text><rect x="50" y="515" width="390" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="545" font-size="18" font-weight="650">备份 → Reload</text><text x="66" y="573" font-size="14" fill="#365564">CPU 中保留内容；Wake 后拷回</text><text x="66" y="596" font-size="14" fill="#365564">恢复参数视图与相关引用关系</text><rect x="520" y="515" width="390" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="536" y="545" font-size="18" font-weight="650">释放 → 重建</text><text x="536" y="573" font-size="14" fill="#365564">Sleep 释放 Buffer 或清理引用</text><text x="536" y="596" font-size="14" fill="#365564">Wake 清零梯度，后续按需重建</text><text x="34" y="675" font-size="14" fill="#486573">这里的可释放梯度须已完成所需更新；梯度累积中间态不能按同样规则直接丢弃。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Selective Offload 的资源取舍</title><desc id="d">参数与优化器状态离开 GPU，重载仍需维持对象视图与同步</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eff7ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#318f77" stroke-width="1.5" fill="none"/></marker></defs><rect width="960" height="460" rx="16" fill="url(#bg)"/><text x="37" y="40" fill="#0d8865" font-size="13" font-family="system-ui,PingFang SC" font-weight="700">AI SYSTEMS · EXPLAINER</text><text x="37" y="85" fill="#183a53" font-size="27" font-family="system-ui,PingFang SC" font-weight="750">Selective Offload 的资源取舍</text><text x="37" y="116" fill="#517189" font-size="15" font-family="system-ui,PingFang SC">参数与优化器状态离开 GPU，重载仍需维持对象视图与同步</text><rect x="141.5" y="201" width="161" height="113" rx="13" fill="#ddf8e8" stroke="#2eac78" stroke-width="2"/><text x="222" y="238" fill="#1a3b54" font-family="system-ui,PingFang SC" font-size="16" font-weight="700" text-anchor="middle">GPU State</text><text x="222" y="271" fill="#466378" font-family="system-ui,PingFang SC" font-size="12" text-anchor="middle">参数与梯度</text><rect x="313.5" y="201" width="161" height="113" rx="13" fill="#dcecff" stroke="#418bd2" stroke-width="2"/><text x="394" y="238" fill="#1a3b54" font-family="system-ui,PingFang SC" font-size="16" font-weight="700" text-anchor="middle">CPU Buffer</text><text x="394" y="271" fill="#466378" font-family="system-ui,PingFang SC" font-size="12" text-anchor="middle">Host / Pinned</text><rect x="485.5" y="201" width="161" height="113" rx="13" fill="#fff0d8" stroke="#d88a3c" stroke-width="2"/><text x="566" y="238" fill="#1a3b54" font-family="system-ui,PingFang SC" font-size="16" font-weight="700" text-anchor="middle">Offload</text><text x="566" y="271" fill="#466378" font-family="system-ui,PingFang SC" font-size="12" text-anchor="middle">搬运并同步</text><rect x="657.5" y="201" width="161" height="113" rx="13" fill="#ede6ff" stroke="#9075cb" stroke-width="2"/><text x="738" y="238" fill="#1a3b54" font-family="system-ui,PingFang SC" font-size="16" font-weight="700" text-anchor="middle">Reload</text><text x="738" y="271" fill="#466378" font-family="system-ui,PingFang SC" font-size="12" text-anchor="middle">恢复训练状态</text><path d="M306.5 257H305.5" fill="none" stroke="#318f77" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M478.5 257H477.5" fill="none" stroke="#318f77" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M650.5 257H649.5" fill="none" stroke="#318f77" stroke-width="2.4" marker-end="url(#arrow)"/><text x="480" y="409" text-anchor="middle" font-family="system-ui,PingFang SC" font-size="13" fill="#48657a">概念示意 · 不代表完整执行时序或 Profiling 数据</text></svg>
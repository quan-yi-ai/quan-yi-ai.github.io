<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" role="img" aria-labelledby="t d"><title id="t">Event Loop：协程何时交出执行权</title><desc id="d">单线程事件循环在 await I/O 时调度其他已就绪任务</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff7ff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#138c72" stroke-width="1.5" fill="none"/></marker></defs><rect width="960" height="485" rx="16" fill="url(#bg)"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="36" y="40" fill="#118765" font-weight="700" font-size="13">PYTHON · RUNTIME</text><text x="36" y="83" fill="#17324b" font-size="27" font-weight="750">Event Loop：协程何时交出执行权</text><text x="36" y="115" fill="#4c6980" font-size="15">单线程事件循环在 await I/O 时调度其他已就绪任务</text><rect x="58" y="177" width="230" height="83" rx="13" fill="#ddf6e8" stroke="#19a171" stroke-width="2"/><text x="173" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">Coroutine A</text><text x="173" y="232" font-size="13" text-anchor="middle" fill="#43647a">await network I/O</text><rect x="364" y="177" width="230" height="83" rx="13" fill="#e2ecff" stroke="#458ad5" stroke-width="2"/><text x="479" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">Event Loop</text><text x="479" y="232" font-size="13" text-anchor="middle" fill="#43647a">ready queue</text><rect x="670" y="177" width="230" height="83" rx="13" fill="#fff0d8" stroke="#d98837" stroke-width="2"/><text x="785" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">Coroutine B</text><text x="785" y="232" font-size="13" text-anchor="middle" fill="#43647a">runs while A waits</text><path d="M290 217L350 217" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><path d="M596 217L656 217" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><rect x="365" y="325" width="228" height="66" rx="13" fill="#eee5ff" stroke="#8874ce" stroke-width="2"/><text x="479" y="355" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">I/O completion</text><text x="479" y="380" font-size="13" text-anchor="middle" fill="#43647a">A returns to ready queue</text><path d="M478 264L478 311" stroke="#138c72" stroke-width="2.7" marker-end="url(#arr)" fill="none"/><text x="480" y="438" text-anchor="middle" font-size="15" fill="#4a6174">await 让出执行权；并不会创造一个新的 OS 线程</text></g></svg>
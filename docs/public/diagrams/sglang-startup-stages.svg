<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">SGLang：启动到服务就绪</title><desc id="desc">按日志定位初始化阶段；具体顺序与显存分配位置随版本和配置变化。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="575" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">SGLang：启动到服务就绪</text><text x="34" y="85" font-size="15" fill="#486573">按日志定位初始化阶段；具体顺序与显存分配位置随版本和配置变化。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V308.5H790V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M660 420H613" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M350 420H303" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">1 · ServerArgs</text><text x="56" y="203" font-size="14" fill="#365564">读取启动参数与运行配置</text><text x="56" y="226" font-size="14" fill="#365564">确认模型、设备与并行选项</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">2 · Distributed</text><text x="366" y="203" font-size="14" fill="#365564">初始化分布式环境</text><text x="366" y="226" font-size="14" fill="#365564">进程组与设备通信准备</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">3 · Weight Load</text><text x="676" y="203" font-size="14" fill="#365564">加载模型及权重</text><text x="676" y="226" font-size="14" fill="#365564">观察加载时间与显存变化</text><rect x="660" y="365" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="395" font-size="18" font-weight="650">4 · KV Pool</text><text x="676" y="423" font-size="14" fill="#365564">创建 KV Cache 等内存池</text><text x="676" y="446" font-size="14" fill="#365564">确认 Token 容量与余量</text><rect x="350" y="365" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="395" font-size="18" font-weight="650">5 · Graph Capture</text><text x="366" y="423" font-size="14" fill="#365564">按形状捕获可用计算图</text><text x="366" y="446" font-size="14" fill="#365564">记录额外内存与捕获耗时</text><rect x="40" y="365" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="56" y="395" font-size="18" font-weight="650">6 · HTTP Ready</text><text x="56" y="423" font-size="14" fill="#365564">服务接口进入就绪状态</text><text x="56" y="446" font-size="14" fill="#365564">再验证真实请求与推理响应</text><text x="34" y="545" font-size="14" fill="#486573">阶段示意；启动成功不等于并发请求下的吞吐、尾延迟和显存占用已得到验证。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">RDMA ≠ 全链路零拷贝</title><desc id="d">网络传输的协议，不自动决定应用层的 Buffer / Staging / GPU 拷贝</desc><defs><linearGradient id="bg"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f7ff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#16895b" stroke-width="1.4" fill="none"/></marker></defs><rect width="960" height="500" rx="16" fill="url(#bg)"/><g font-family="Inter,system-ui,PingFang SC,sans-serif"><text x="37" y="39" text-anchor="start" font-size="12" fill="#087f55" font-weight="500">AI SYSTEMS / TRANSFERQUEUE</text><text x="37" y="80" text-anchor="start" font-size="26" fill="#17324b" font-weight="750">RDMA ≠ 全链路零拷贝</text><text x="37" y="110" text-anchor="start" font-size="14" fill="#17324b" font-weight="500">网络传输的协议，不自动决定应用层的 Buffer / Staging / GPU 拷贝</text><rect x="27" y="204" width="201" height="80" rx="9" fill="#dcf8e9" stroke="#16895b" stroke-width="1.3"/><text x="127" y="237" text-anchor="middle" font-size="17" fill="#17324b" font-weight="700">GPU tensor</text><text x="127" y="261" text-anchor="middle" font-size="13" fill="#17324b" font-weight="500">生产端</text><path d="M235,244L259,244" stroke="#16895b" stroke-width="2"  marker-end="url(#arr)" fill="none"/><rect x="264" y="204" width="201" height="80" rx="9" fill="#e1efff" stroke="#16895b" stroke-width="1.3"/><text x="364" y="237" text-anchor="middle" font-size="17" fill="#17324b" font-weight="700">Host buffer</text><text x="364" y="261" text-anchor="middle" font-size="13" fill="#17324b" font-weight="500">可能的 staging</text><path d="M472,244L496,244" stroke="#16895b" stroke-width="2"  marker-end="url(#arr)" fill="none"/><rect x="501" y="204" width="201" height="80" rx="9" fill="#fff0d8" stroke="#16895b" stroke-width="1.3"/><text x="601" y="237" text-anchor="middle" font-size="17" fill="#17324b" font-weight="700">NIC / RDMA</text><text x="601" y="261" text-anchor="middle" font-size="13" fill="#17324b" font-weight="500">网络阶段</text><path d="M709,244L733,244" stroke="#16895b" stroke-width="2"  marker-end="url(#arr)" fill="none"/><rect x="738" y="204" width="201" height="80" rx="9" fill="#f0e7ff" stroke="#16895b" stroke-width="1.3"/><text x="838" y="237" text-anchor="middle" font-size="17" fill="#17324b" font-weight="700">Host / GPU</text><text x="838" y="261" text-anchor="middle" font-size="13" fill="#17324b" font-weight="500">接收端</text><text x="40" y="336" text-anchor="start" font-size="15" fill="#17324b" font-weight="500">RDMA 可优化网络传输，不能证明前后没有 CPU 复制、序列化或数据重排。</text><text x="40" y="378" text-anchor="start" font-size="15" fill="#17324b" font-weight="500">GPUDirect 是否可用还取决于 GPU / NIC / 驱动 / Memory registration 与配置。</text><text x="38" y="486" text-anchor="start" font-size="11" fill="#476078" font-weight="500">技术机制示意 · 具体行为以对应版本源码及配置为准</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">MoE Router：按排查成本逐层验证</title><desc id="desc">层级代表调试路径；后续检查不能替代前一层的输入身份与语义校验。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="580" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">MoE Router：按排查成本逐层验证</text><text x="34" y="85" font-size="15" fill="#486573">层级代表调试路径；后续检查不能替代前一层的输入身份与语义校验。</text><path d="M440 202.5H517" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M715 260V311H715V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M520 422.5H443" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="145" width="390" height="115" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="66" y="175" font-size="18" font-weight="650">L1：重放一致性</text><text x="66" y="203" font-size="14" fill="#365564">相同配置与输入重复执行</text><text x="66" y="226" font-size="14" fill="#365564">先确认结果是否稳定</text><rect x="520" y="145" width="390" height="115" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="536" y="175" font-size="18" font-weight="650">L2：配置不变性</text><text x="536" y="203" font-size="14" fill="#365564">改变 Batch / Padding 等布局</text><text x="536" y="226" font-size="14" fill="#365564">核对语义等价输入的输出</text><rect x="520" y="365" width="390" height="115" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="536" y="395" font-size="18" font-weight="650">L3a：CPU 参考实现</text><text x="536" y="423" font-size="14" fill="#365564">与独立 Oracle 对照</text><text x="536" y="446" font-size="14" fill="#365564">先比较离散路由，再比较数值</text><rect x="50" y="365" width="390" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="395" font-size="18" font-weight="650">L3b：跨引擎对照</text><text x="66" y="423" font-size="14" fill="#365564">训练与推理实现同输入比较</text><text x="66" y="446" font-size="14" fill="#365564">结合梯度与首差分定位问题</text><text x="34" y="550" font-size="14" fill="#486573">统一身份与判定语义后再比较离散选择、数值和梯度；负向注入用于检验失败路径。</text></g></svg>
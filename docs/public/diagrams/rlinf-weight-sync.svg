<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">权重同步：从训练分片到推理版本</title><desc id="desc">先完成参数布局转换与交付，再让请求按确定的版本边界使用新权重。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="590" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">权重同步：从训练分片到推理版本</text><text x="34" y="85" font-size="15" fill="#486573">先完成参数布局转换与交付，再让请求按确定的版本边界使用新权重。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V316H480V377" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">训练参数</text><text x="56" y="203" font-size="14" fill="#365564">FSDP / Megatron 等布局</text><text x="56" y="226" font-size="14" fill="#365564">确认本次更新已完成</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">同步与布局转换</text><text x="366" y="203" font-size="14" fill="#365564">聚合、切分、重排或映射</text><text x="366" y="226" font-size="14" fill="#365564">按后端要求交付参数</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Rollout Engine</text><text x="676" y="203" font-size="14" fill="#365564">写入或替换推理参数</text><text x="676" y="226" font-size="14" fill="#365564">完成必要的通信 / 设备同步</text><rect x="285" y="380" width="390" height="120" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="301" y="410" font-size="18" font-weight="650">版本切换边界</text><text x="301" y="438" font-size="14" fill="#365564">确认权重更新完成后发布可用版本</text><text x="301" y="461" font-size="14" fill="#365564">管理进行中请求与历史 Experience 的策略版本</text><text x="301" y="484" font-size="14" fill="#365564">版本控制贯穿交付过程，不是一个计算层</text><text x="34" y="560" font-size="14" fill="#486573">完整协议取决于框架实现；尤其要核对旧请求、参数别名、异步传输和缓存状态。</text></g></svg>
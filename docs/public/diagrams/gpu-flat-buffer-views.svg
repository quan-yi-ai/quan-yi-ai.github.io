<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">GPU Flat Buffer 与 CPU 参数视图</title><desc id="desc">参数共享连续存储，CPU 备份用相同偏移建立视图；先完成备份再释放，恢复后清理临时 CPU 视图。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667488"/></marker></defs>
<rect width="960" height="450" rx="12" fill="#fff"/>
<g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#293a50"><text x="28" y="36" font-size="23" fill="#293a50" font-weight="650">Flat Buffer：一次备份，多份参数视图</text><text x="28" y="69" font-size="15" fill="#293a50">示意：三个参数共享一个连续存储，切片偏移在 CPU 备份中保持对应。</text><text x="28" y="117" font-size="16" fill="#293a50" font-weight="650">GPU param_data</text><rect x="185" y="135" width="190" height="54" fill="#e9f6ef" stroke="#8c9caf"/><text x="280.0" y="168" font-size="15" fill="#293a50" text-anchor="middle">P₀ · [0, a)</text><rect x="375" y="135" width="250" height="54" fill="#eef2ff" stroke="#8c9caf"/><text x="500.0" y="168" font-size="15" fill="#293a50" text-anchor="middle">P₁ · [a, b)</text><rect x="625" y="135" width="285" height="54" fill="#fdf1e3" stroke="#8c9caf"/><text x="767.5" y="168" font-size="15" fill="#293a50" text-anchor="middle">P₂ · [b, c)</text><text x="28" y="280" font-size="16" fill="#293a50" font-weight="650">CPU cpu_data</text><rect x="185" y="298" width="190" height="54" fill="#e9f6ef" stroke="#8c9caf"/><text x="280.0" y="331" font-size="15" fill="#293a50" text-anchor="middle">P₀ · [0, a)</text><rect x="375" y="298" width="250" height="54" fill="#eef2ff" stroke="#8c9caf"/><text x="500.0" y="331" font-size="15" fill="#293a50" text-anchor="middle">P₁ · [a, b)</text><rect x="625" y="298" width="285" height="54" fill="#fdf1e3" stroke="#8c9caf"/><text x="767.5" y="331" font-size="15" fill="#293a50" text-anchor="middle">P₂ · [b, c)</text><path d="M280 193V292" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><text x="328" y="226" font-size="15" fill="#293a50">offload：先复制整个 Flat Buffer，再释放 GPU Storage</text><text x="328" y="254" font-size="14" fill="#293a50">CPU View：cpu_data[start:end].view(param.shape)</text><text x="28" y="394" font-size="15" fill="#293a50">Sleep：参数对象仍存在，权重同步可改读对应 CPU View。</text><text x="28" y="423" font-size="15" fill="#293a50">Reload：恢复共享 GPU Storage 并拷回，删除临时 CPU View；不承诺设备 VA 不变。</text></g></svg>

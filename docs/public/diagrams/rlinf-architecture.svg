<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">RLinf：算法控制、Worker 与通道</title><desc id="desc">Runner 编排角色；Channel 连接数据生产者与消费者，并非必经的串行计算层。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">RLinf：算法控制、Worker 与通道</text><text x="34" y="85" font-size="15" fill="#486573">Runner 编排角色；Channel 连接数据生产者与消费者，并非必经的串行计算层。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V325H180V387" fill="none" stroke="#456c7c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M790 255V325H780V387" fill="none" stroke="#456c7c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M310 447.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 447.5H647" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Hydra / YAML</text><text x="56" y="203" font-size="14" fill="#365564">资源布局与算法配置</text><text x="56" y="226" font-size="14" fill="#365564">定义 Worker 与运行参数</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Runner</text><text x="366" y="203" font-size="14" fill="#365564">算法生命周期与调度</text><text x="366" y="226" font-size="14" fill="#365564">调用角色的分布式接口</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">WorkerGroup</text><text x="676" y="203" font-size="14" fill="#365564">创建与管理远程 Worker</text><text x="676" y="226" font-size="14" fill="#365564">承载训练、采样和环境角色</text><rect x="50" y="390" width="260" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="420" font-size="18" font-weight="650">Rollout / Env Worker</text><text x="66" y="448" font-size="14" fill="#365564">推理生成或环境交互</text><text x="66" y="471" font-size="14" fill="#365564">产出轨迹与相关反馈</text><rect x="350" y="390" width="260" height="115" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="420" font-size="18" font-weight="650">Channel</text><text x="366" y="448" font-size="14" fill="#365564">按生产 / 消费关系传递数据</text><text x="366" y="471" font-size="14" fill="#365564">具体 Payload 和同步方式依角色</text><rect x="650" y="390" width="260" height="115" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="666" y="420" font-size="18" font-weight="650">Train Worker</text><text x="666" y="448" font-size="14" fill="#365564">使用训练后端计算 Loss</text><text x="666" y="471" font-size="14" fill="#365564">更新模型并发起所需权重同步</text><text x="34" y="570" font-size="14" fill="#486573">图示角色分层；不代表所有 RLinf 配方都使用同一种 Worker 数量或相同的数据通道。</text></g></svg>
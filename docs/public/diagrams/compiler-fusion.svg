<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">算子融合：减少中间结果的 HBM 往返</title><desc id="desc">示例计算 y = relu(x + 1)；图中只比较逐元素操作的数据读写。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="590" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">算子融合：减少中间结果的 HBM 往返</text><text x="34" y="85" font-size="15" fill="#486573">示例计算 y = relu(x + 1)；图中只比较逐元素操作的数据读写。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M300 440H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 440H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">输入 x</text><text x="56" y="203" font-size="14" fill="#365564">从 HBM 读取</text><text x="56" y="226" font-size="14" fill="#365564">分别执行多个 Kernel</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">临时结果 tmp = x + 1</text><text x="366" y="203" font-size="14" fill="#365564">写入 HBM</text><text x="366" y="226" font-size="14" fill="#365564">下一个 Kernel 再从 HBM 读取</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">输出 y = relu(tmp)</text><text x="676" y="203" font-size="14" fill="#365564">结果写回 HBM</text><text x="676" y="226" font-size="14" fill="#365564">多次 Launch 与中间访存</text><rect x="40" y="385" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="56" y="415" font-size="18" font-weight="650">输入 x</text><text x="56" y="443" font-size="14" fill="#365564">从 HBM 读取</text><text x="56" y="466" font-size="14" fill="#365564">进入一个融合 Kernel</text><rect x="350" y="385" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="415" font-size="18" font-weight="650">融合计算</text><text x="366" y="443" font-size="14" fill="#365564">加 1 与 ReLU 在 Kernel 内</text><text x="366" y="466" font-size="14" fill="#365564">中间值无需完整写回 HBM</text><rect x="660" y="385" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="676" y="415" font-size="18" font-weight="650">输出 y</text><text x="676" y="443" font-size="14" fill="#365564">结果写回 HBM</text><text x="676" y="466" font-size="14" fill="#365564">减少 Launch 与中间流量</text><text x="34" y="560" font-size="14" fill="#486573">融合可能增加寄存器压力；实际收益仍取决于形状、硬件与调度。</text></g></svg>
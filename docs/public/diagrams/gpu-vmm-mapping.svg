<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">CUDA VMM：地址与物理分配分别管理</title><desc id="desc">先准备地址区间和物理句柄，再建立映射并设置访问权限。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="650" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">CUDA VMM：地址与物理分配分别管理</text><text x="34" y="85" font-size="15" fill="#486573">先准备地址区间和物理句柄，再建立映射并设置访问权限。</text><path d="M300 195H325V295H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M300 395H325V295H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 295H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 350V403.5H480V457" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 515H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="140" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="170" font-size="18" font-weight="650">预留虚拟地址</text><text x="56" y="198" font-size="14" fill="#365564">cuMemAddressReserve</text><text x="56" y="221" font-size="14" fill="#365564">保留 VA 区间，不等于已有显存</text><rect x="40" y="340" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="56" y="370" font-size="18" font-weight="650">创建物理分配</text><text x="56" y="398" font-size="14" fill="#365564">cuMemCreate</text><text x="56" y="421" font-size="14" fill="#365564">得到物理分配句柄</text><rect x="350" y="240" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="366" y="270" font-size="18" font-weight="650">建立映射</text><text x="366" y="298" font-size="14" fill="#365564">cuMemMap</text><text x="366" y="321" font-size="14" fill="#365564">VA 区间 ↔ 物理句柄</text><rect x="660" y="240" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="270" font-size="18" font-weight="650">设置访问权限</text><text x="676" y="298" font-size="14" fill="#365564">cuMemSetAccess</text><text x="676" y="321" font-size="14" fill="#365564">设备才可按权限访问</text><rect x="350" y="460" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="490" font-size="18" font-weight="650">暂停或释放映射</text><text x="366" y="518" font-size="14" fill="#365564">cuMemUnmap</text><text x="366" y="541" font-size="14" fill="#365564">地址预留可以继续保留</text><rect x="660" y="460" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="676" y="490" font-size="18" font-weight="650">释放句柄引用</text><text x="676" y="518" font-size="14" fill="#365564">cuMemRelease</text><text x="676" y="541" font-size="14" fill="#365564">最后按需 AddressFree</text><text x="34" y="620" font-size="14" fill="#486573">解除映射和释放句柄引用是不同操作；物理分配的回收取决于所有映射与引用。</text></g></svg>
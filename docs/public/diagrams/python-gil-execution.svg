<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" role="img" aria-labelledby="t d"><title id="t">GIL、CPU 并行与 I/O 释放</title><desc id="d">传统启用 GIL 的 CPython 与多个独立解释器进程的差别</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eff7ff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#138c72" stroke-width="1.5" fill="none"/></marker></defs><rect width="960" height="485" rx="16" fill="url(#bg)"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="36" y="40" fill="#118765" font-weight="700" font-size="13">PYTHON · RUNTIME</text><text x="36" y="83" fill="#17324b" font-size="27" font-weight="750">GIL、CPU 并行与 I/O 释放</text><text x="36" y="115" fill="#4c6980" font-size="15">传统启用 GIL 的 CPython 与多个独立解释器进程的差别</text><rect x="54" y="175" width="415" height="180" rx="13" fill="#e1edff" stroke="#458bd0" stroke-width="2"/><text x="261.5" y="205" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">传统 GIL CPython</text><text x="261.5" y="230" font-size="13" text-anchor="middle" fill="#43647a">同一解释器实例中的线程</text><rect x="490" y="175" width="415" height="180" rx="13" fill="#ddf8e8" stroke="#19a56c" stroke-width="2"/><text x="697.5" y="205" font-size="17" font-weight="700" text-anchor="middle" fill="#193b54">多个 CPython 进程</text><text x="697.5" y="230" font-size="13" text-anchor="middle" fill="#43647a">独立解释器与 GIL</text><text x="260" y="298" text-anchor="middle" font-size="16" fill="#254b63">Thread A ↔ Thread B</text><text x="699" y="298" text-anchor="middle" font-size="16" fill="#254b63">Process 0 ∥ Process 1</text><text x="480" y="439" text-anchor="middle" font-size="15" fill="#4a6174">注：Python 3.13+ 还存在可选 free-threaded 构建，不能一概而论</text></g></svg>
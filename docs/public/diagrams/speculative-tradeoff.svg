<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">投机解码：三个成本共同决定收益</title><desc id="desc">接受率高不等于整体快，候选数与最终提交数也不是同一口径。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="620" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">投机解码：三个成本共同决定收益</text><text x="34" y="85" font-size="15" fill="#486573">接受率高不等于整体快，候选数与最终提交数也不是同一口径。</text><path d="M170 260V326H480V392" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 260V326H480V392" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 260V326H480V392" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="115" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Draft 成本 Td</text><text x="56" y="203" font-size="14" fill="#365564">草稿网络的前向与采样</text><text x="56" y="226" font-size="14" fill="#365564">串行步数随方案变化</text><rect x="350" y="145" width="260" height="115" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Target 验证 Tv</text><text x="366" y="203" font-size="14" fill="#365564">处理候选块的目标前向</text><text x="366" y="226" font-size="14" fill="#365564">包含相应 Attention / KV 成本</text><rect x="660" y="145" width="260" height="115" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">其他开销 To</text><text x="676" y="203" font-size="14" fill="#365564">调度、提交与回滚</text><text x="676" y="226" font-size="14" fill="#365564">通信、图管理与额外 Buffer</text><rect x="235" y="395" width="490" height="135" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="251" y="425" font-size="18" font-weight="650">每轮最终提交 A 个 Token</text><text x="251" y="453" font-size="14" fill="#365564">有效吞吐约 A / (Td + Tv + To)</text><text x="251" y="476" font-size="14" fill="#365564">相对单 Token 基线 Tb 的加速约 A × Tb / 总成本</text><text x="251" y="499" font-size="14" fill="#365564">A 包含接受草稿及校正 / 额外目标 Token</text><text x="34" y="590" font-size="14" fill="#486573">延长 Draft 可能提高 A，也可能增加 Td、Tv 或提前拒绝；参数应结合负载实测。</text></g></svg>
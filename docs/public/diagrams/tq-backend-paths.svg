<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">SimpleStorage 与 MooncakeStore：概念数据路径</title><desc id="desc">两者都可通过统一 API 访问，但存储位置、协议与部署依赖不同。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="610" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">SimpleStorage 与 MooncakeStore：概念数据路径</text><text x="34" y="85" font-size="15" fill="#486573">两者都可通过统一 API 访问，但存储位置、协议与部署依赖不同。</text><path d="M300 207.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 207.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M300 457.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 457.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="125" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">生产端 Tensor</text><text x="56" y="203" font-size="14" fill="#365564">按字段写入 Experience</text><text x="56" y="226" font-size="14" fill="#365564">GPU 数据可能先转为 Host 可用形式</text><rect x="350" y="145" width="260" height="125" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">SimpleStorage</text><text x="366" y="203" font-size="14" fill="#365564">基础 CPU DRAM 路径</text><text x="366" y="226" font-size="14" fill="#365564">序列化 / ZMQ 等交付</text><text x="366" y="249" font-size="14" fill="#365564">部分版本可启用 SSD 扩展</text><rect x="660" y="145" width="260" height="125" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">消费端</text><text x="676" y="203" font-size="14" fill="#365564">取回所需样本字段</text><text x="676" y="226" font-size="14" fill="#365564">必要时传回训练设备</text><rect x="40" y="395" width="260" height="125" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="56" y="425" font-size="18" font-weight="650">生产端 Tensor</text><text x="56" y="453" font-size="14" fill="#365564">Key / 字段组织数据</text><text x="56" y="476" font-size="14" fill="#365564">注册、布局转换与缓冲区准备</text><rect x="350" y="395" width="260" height="125" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="425" font-size="18" font-weight="650">MooncakeStore</text><text x="366" y="453" font-size="14" fill="#365564">分层 KV / TCP 或 RDMA</text><text x="366" y="476" font-size="14" fill="#365564">GDR 为可选受限路径</text><text x="366" y="499" font-size="14" fill="#365564">可能仍有 GPU / Host Staging</text><rect x="660" y="395" width="260" height="125" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="676" y="425" font-size="18" font-weight="650">消费端</text><text x="676" y="453" font-size="14" fill="#365564">按元信息找到并读取数据</text><text x="676" y="476" font-size="14" fill="#365564">确认数据到位和设备同步</text><text x="34" y="580" font-size="14" fill="#486573">不是固定拷贝次数示意；RDMA 或 GDR 名称本身不能证明端到端零拷贝。</text></g></svg>
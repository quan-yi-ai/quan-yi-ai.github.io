<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">TMS：地址稳定与内容保存是两件事</title><desc id="desc">Pause 前必须结束相关 GPU 使用；未映射的地址不能直接供 Kernel 访问。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="620" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">TMS：地址稳定与内容保存是两件事</text><text x="34" y="85" font-size="15" fill="#486573">Pause 前必须结束相关 GPU 使用；未映射的地址不能直接供 Kernel 访问。</text><path d="M300 195H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 195H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 250V320H255V387" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M480 320H705V387" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="140" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="170" font-size="18" font-weight="650">Run</text><text x="56" y="198" font-size="14" fill="#365564">VA → GPU 物理页</text><text x="56" y="221" font-size="14" fill="#365564">Tensor 可以正常访问</text><rect x="350" y="140" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="170" font-size="18" font-weight="650">Pause</text><text x="366" y="198" font-size="14" fill="#365564">按配置备份，再解除映射</text><text x="366" y="221" font-size="14" fill="#365564">释放受管物理资源，保留 VA</text><rect x="660" y="140" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="170" font-size="18" font-weight="650">Resume</text><text x="676" y="198" font-size="14" fill="#365564">重新分配并映射到原 VA</text><text x="676" y="221" font-size="14" fill="#365564">需要时将备份内容拷回</text><rect x="60" y="390" width="390" height="135" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="76" y="420" font-size="18" font-weight="650">启用 CPU Backup</text><text x="76" y="448" font-size="14" fill="#365564">Pause 前复制有效内容到 CPU</text><text x="76" y="471" font-size="14" fill="#365564">Resume 后回填内容</text><text x="76" y="494" font-size="14" fill="#365564">会产生主机内存与 D2H/H2D 开销</text><rect x="510" y="390" width="390" height="135" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="526" y="420" font-size="18" font-weight="650">未启用 CPU Backup</text><text x="526" y="448" font-size="14" fill="#365564">仅保留地址不保证数值仍存在</text><text x="526" y="471" font-size="14" fill="#365564">恢复映射后，重新加载或重建内容</text><text x="526" y="494" font-size="14" fill="#365564">不得直接使用未初始化的数据</text><text x="34" y="590" font-size="14" fill="#486573">CUDA Graph 引用的地址稳定，只解决地址条件；内容、形状与执行依赖仍须有效。</text></g></svg>
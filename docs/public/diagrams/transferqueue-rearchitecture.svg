<text x="309" y="181" fill="#172d43" font-size="18" font-weight="700">控制面 / Metadata</text>
<text x="700" y="181" fill="#172d43" font-size="18" font-weight="700">数据面 / Payload</text>
<g fill="#dfedff" stroke="#4583bd" stroke-width="1.2">
<rect x="56" y="220" width="178" height="55" rx="8"/><rect x="56" y="311" width="178" height="55" rx="8"/>
<rect x="309" y="218" width="312" height="55" rx="8"/><rect x="309" y="307" width="312" height="104" rx="8"/>
<rect x="700" y="218" width="362" height="55" rx="8"/><rect x="700" y="306" width="362" height="105" rx="8"/>
</g>
<g text-anchor="middle" fill="#172d43" font-weight="650" font-size="16">
<text x="145" y="253">Producer / Rollout</text><text x="145" y="344">Consumer / Trainer</text>
<text x="465" y="242">Ray Actor Shell · Python</text>
<text x="465" y="337">Rust Metadata Engine</text>
<text x="881" y="246">StorageManager / SimpleStorage</text>
<text x="881" y="335">PayloadTransfer 接口</text>
</g>
<g text-anchor="middle" font-size="12" fill="#087f55">
<text x="465" y="262">发现 · 启动 · 配置</text>
<text x="465" y="361">ZMQ RPC · MsgPack · Bitset</text>
<text x="465" y="382">PyO3 进程内集成</text>
<text x="881" y="264">PUT / GET · 数据存储</text>
<text x="881" y="357">ZMQ 适配器（已提案实现）</text>
<text x="881" y="380">UCX / NIXL（设计目标）</text>

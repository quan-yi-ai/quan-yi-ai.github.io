<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="t d">
<title id="t">TransferQueue 控制面与数据面及重构边界</title>
<desc id="d">左侧客户端生产者与消费者通过控制面获取元数据，Ray 管理 Actor 生命周期，Rust 处理高频 metadata RPC；数据面中 StorageManager 和 SimpleStorage 使用 PayloadTransfer 抽象连接 ZMQ 或未来的 UCX、NIXL 适配器。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#4583bd" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="520" rx="18" fill="url(#bg)"/>
<g font-family="system-ui, PingFang SC, sans-serif">
<text x="38" y="42" font-size="14" letter-spacing="2" fill="#087f55">TRANSFERQUEUE / SYSTEM ARCHITECTURE</text>
<text x="38" y="83" font-size="27" font-weight="750" fill="#172d43">控制面与数据面：两种不同的重构</text>
<text x="38" y="112" font-size="14" fill="#172d43">控制 RPC 和 Tensor Payload 沿不同路径流动，不应把 Rust Controller 与 RDMA 传输混成一次替换。</text>
<g fill="#def8e9" stroke="#4583bd" stroke-width="1.6">
<rect x="38" y="148" width="214" height="297" rx="12"/>
<rect x="291" y="148" width="350" height="297" rx="12"/>
<rect x="682" y="148" width="400" height="297" rx="12"/>
</g>

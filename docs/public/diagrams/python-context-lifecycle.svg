<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">with：进入、使用与退出</title><desc id="desc">__enter__ 成功后，即使代码块抛出异常，也会进入 __exit__。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="590" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">with：进入、使用与退出</text><text x="34" y="85" font-size="15" fill="#486573">__enter__ 成功后，即使代码块抛出异常，也会进入 __exit__。</text><path d="M300 217.5H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 217.5H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 290V343.5H715V397" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 290V350H245V397" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="145" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">进入</text><text x="56" y="203" font-size="14" fill="#365564">调用 __enter__()</text><text x="56" y="226" font-size="14" fill="#365564">返回值绑定给 as 后的变量</text><text x="56" y="249" font-size="14" fill="#365564">此步抛出异常则不会调用 __exit__</text><rect x="350" y="145" width="260" height="145" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">使用</text><text x="366" y="203" font-size="14" fill="#365564">执行 with 内的代码块</text><text x="366" y="226" font-size="14" fill="#365564">可能正常结束、return 或抛出异常</text><text x="366" y="249" font-size="14" fill="#365564">资源由管理器约定持有</text><rect x="660" y="145" width="260" height="145" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">退出</text><text x="676" y="203" font-size="14" fill="#365564">__exit__(type, exc, tb)</text><text x="676" y="226" font-size="14" fill="#365564">正常退出时三个参数均为 None</text><text x="676" y="249" font-size="14" fill="#365564">执行清理或事务收尾</text><rect x="50" y="400" width="390" height="105" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="430" font-size="18" font-weight="650">异常 + 返回真值</text><text x="66" y="458" font-size="14" fill="#365564">抑制本次代码块异常</text><text x="66" y="481" font-size="14" fill="#365564">继续 with 后的代码</text><rect x="520" y="400" width="390" height="105" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="536" y="430" font-size="18" font-weight="650">异常 + 返回假值</text><text x="536" y="458" font-size="14" fill="#365564">代码块的异常继续传播</text><text x="536" y="481" font-size="14" fill="#365564">__exit__ 自身也可能抛出异常</text><text x="34" y="560" font-size="14" fill="#486573">async with 使用可等待的 __aenter__ / __aexit__，同样需要明确退出语义。</text></g></svg>
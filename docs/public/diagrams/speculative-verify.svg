<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">投机解码：提议、验证与连续前缀提交</title><desc id="desc">目标模型并行算分数；接受 / 拒绝及校正采样规则决定最终输出语义。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">投机解码：提议、验证与连续前缀提交</text><text x="34" y="85" font-size="15" fill="#486573">目标模型并行算分数；接受 / 拒绝及校正采样规则决定最终输出语义。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V321H715V387" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V325H245V387" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Draft</text><text x="56" y="203" font-size="14" fill="#365564">提出一段候选 Token</text><text x="56" y="226" font-size="14" fill="#365564">每个位置带有对应条件前缀</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Target</text><text x="366" y="203" font-size="14" fill="#365564">一次前向并行计算分布</text><text x="366" y="226" font-size="14" fill="#365564">并非直接提交全部候选</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Verification</text><text x="676" y="203" font-size="14" fill="#365564">沿候选前缀依次判断</text><text x="676" y="226" font-size="14" fill="#365564">首个拒绝后作废后续草稿</text><rect x="50" y="390" width="390" height="115" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="66" y="420" font-size="18" font-weight="650">出现拒绝</text><text x="66" y="448" font-size="14" fill="#365564">提交已接受前缀 + 校正 Token</text><text x="66" y="471" font-size="14" fill="#365564">随机采样时从剩余质量分布重采样</text><rect x="520" y="390" width="390" height="115" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="536" y="420" font-size="18" font-weight="650">全部接受</text><text x="536" y="448" font-size="14" fill="#365564">提交候选连续前缀</text><text x="536" y="471" font-size="14" fill="#365564">标准链式算法可再提交一个目标 Token</text><text x="34" y="570" font-size="14" fill="#486573">严格分布保持须采用对应的正确验证算法；Greedy 匹配是另一种验证语义。</text></g></svg>
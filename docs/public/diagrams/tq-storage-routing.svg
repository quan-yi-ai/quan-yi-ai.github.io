<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Global Index 如何路由到 StorageUnit</title><desc id="d">示意：两个 StorageUnit，按照 global_index % 2 分组并恢复请求顺序</desc><defs><linearGradient id="bg"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f7ff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#16895b" stroke-width="1.4" fill="none"/></marker></defs><rect width="960" height="500" rx="16" fill="url(#bg)"/><g font-family="Inter,system-ui,PingFang SC,sans-serif"><text x="37" y="39" text-anchor="start" font-size="12" fill="#087f55" font-weight="500">AI SYSTEMS / TRANSFERQUEUE</text><text x="37" y="80" text-anchor="start" font-size="26" fill="#17324b" font-weight="750">Global Index 如何路由到 StorageUnit</text><text x="37" y="110" text-anchor="start" font-size="14" fill="#17324b" font-weight="500">示意：两个 StorageUnit，按照 global_index % 2 分组并恢复请求顺序</text><rect x="38" y="157" width="882" height="65" rx="9" fill="#dcf8e9" stroke="#16895b" stroke-width="1.3"/><text x="58" y="183" text-anchor="start" font-size="16" fill="#17324b" font-weight="500">Consumer requested indexes</text><text x="58" y="208" text-anchor="start" font-size="15" fill="#087f55" font-weight="500">[12, 7, 4, 9]   →   preserve original order</text><rect x="38" y="269" width="416" height="118" rx="9" fill="#e1efff" stroke="#16895b" stroke-width="1.3"/><text x="58" y="297" text-anchor="start" font-size="18" fill="#17324b" font-weight="500">StorageUnit 0</text><text x="58" y="333" text-anchor="start" font-size="17" fill="#087f55" font-weight="500">indexes [12, 4]</text><text x="58" y="365" text-anchor="start" font-size="14" fill="#17324b" font-weight="500">output rows [0, 2]</text><rect x="504" y="269" width="416" height="118" rx="9" fill="#fff0d8" stroke="#16895b" stroke-width="1.3"/><text x="524" y="297" text-anchor="start" font-size="18" fill="#17324b" font-weight="500">StorageUnit 1</text><text x="524" y="333" text-anchor="start" font-size="17" fill="#087f55" font-weight="500">indexes [7, 9]</text><text x="524" y="365" text-anchor="start" font-size="14" fill="#17324b" font-weight="500">output rows [1, 3]</text><path d="M255,222L255,262" stroke="#16895b" stroke-width="2"  marker-end="url(#arr)" fill="none"/><path d="M702,222L702,262" stroke="#16895b" stroke-width="2"  marker-end="url(#arr)" fill="none"/><text x="40" y="432" text-anchor="start" font-size="15" fill="#17324b" font-weight="500">两个 Unit 的返回数据按 batch_positions 放回最终输出，不按到达顺序拼接。</text><text x="38" y="486" text-anchor="start" font-size="11" fill="#476078" font-weight="500">技术机制示意 · 具体行为以对应版本源码及配置为准</text></g></svg>
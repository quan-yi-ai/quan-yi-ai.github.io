<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Global Index 如何路由到 StorageUnit</title><desc id="d">示意：两个 StorageUnit，按照 global_index % 2 分组并恢复请求顺序</desc><defs><linearGradient id="bg"><stop stop-color="#0d1611"/><stop offset="1" stop-color="#182b20"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#89e7aa" stroke-width="1.4" fill="none"/></marker></defs><rect width="960" height="500" rx="16" fill="url(#bg)"/><g font-family="Inter,system-ui,PingFang SC,sans-serif"><text x="37" y="39" text-anchor="start" font-size="12" fill="#83f3a8" font-weight="500">AI SYSTEMS / TRANSFERQUEUE</text><text x="37" y="80" text-anchor="start" font-size="26" fill="#effaf2" font-weight="750">Global Index 如何路由到 StorageUnit</text><text x="37" y="110" text-anchor="start" font-size="14" fill="#acccba" font-weight="500">示意：两个 StorageUnit，按照 global_index % 2 分组并恢复请求顺序</text><rect x="38" y="157" width="882" height="65" rx="9" fill="#152f23" stroke="#518969" stroke-width="1.3"/><text x="58" y="183" text-anchor="start" font-size="16" fill="#c8f1d4" font-weight="500">Consumer requested indexes</text><text x="58" y="208" text-anchor="start" font-size="15" fill="#8bdba9" font-weight="500">[12, 7, 4, 9]   →   preserve original order</text><rect x="38" y="269" width="416" height="118" rx="9" fill="#152f23" stroke="#518969" stroke-width="1.3"/><text x="58" y="297" text-anchor="start" font-size="18" fill="#def9e6" font-weight="500">StorageUnit 0</text><text x="58" y="333" text-anchor="start" font-size="17" fill="#a6e6b8" font-weight="500">indexes [12, 4]</text><text x="58" y="365" text-anchor="start" font-size="14" fill="#b9cfbf" font-weight="500">output rows [0, 2]</text><rect x="504" y="269" width="416" height="118" rx="9" fill="#152f23" stroke="#518969" stroke-width="1.3"/><text x="524" y="297" text-anchor="start" font-size="18" fill="#def9e6" font-weight="500">StorageUnit 1</text><text x="524" y="333" text-anchor="start" font-size="17" fill="#a6e6b8" font-weight="500">indexes [7, 9]</text><text x="524" y="365" text-anchor="start" font-size="14" fill="#b9cfbf" font-weight="500">output rows [1, 3]</text><path d="M255,222L255,262" stroke="#89e7aa" stroke-width="2"  marker-end="url(#arr)" fill="none"/><path d="M702,222L702,262" stroke="#89e7aa" stroke-width="2"  marker-end="url(#arr)" fill="none"/><text x="40" y="432" text-anchor="start" font-size="15" fill="#b5d9c1" font-weight="500">两个 Unit 的返回数据按 batch_positions 放回最终输出，不按到达顺序拼接。</text><text x="38" y="486" text-anchor="start" font-size="11" fill="#769d84" font-weight="500">技术机制示意 · 具体行为以对应版本源码及配置为准</text></g></svg>
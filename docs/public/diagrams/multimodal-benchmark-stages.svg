<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="t d"><title id="t">AR、DiT、VAE 分阶段 Benchmark 的测量范围</title><desc id="d">请求端到端延迟由 AR、DiT、VAE、预处理、调度与传输共同构成</desc><defs><linearGradient id="bg"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf7ff"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#17896b" fill="none" stroke-width="1.5"/></marker></defs><rect width="960" height="455" rx="16" fill="url(#bg)"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="35" y="40" font-size="13" fill="#168566">PERFORMANCE ENGINEERING / MULTI-STAGE</text><text x="35" y="83" font-size="26" font-weight="700" fill="#17324b">多模态生成：逐阶段观测，而非只看总耗时</text><text x="35" y="114" font-size="14" fill="#54718a">带明确请求边界、设备同步和稳定负载的测量才可比较</text><rect x="48" y="192" width="180" height="97" rx="12" fill="#ddf8e8" stroke="#2da174" stroke-width="2"/><rect x="276" y="192" width="180" height="97" rx="12" fill="#deecff" stroke="#458bd0" stroke-width="2"/><rect x="504" y="192" width="180" height="97" rx="12" fill="#fff0da" stroke="#d88b35" stroke-width="2"/><rect x="732" y="192" width="180" height="97" rx="12" fill="#eee7ff" stroke="#9574cb" stroke-width="2"/><g font-size="18" font-weight="700" fill="#193a52" text-anchor="middle"><text x="138" y="228">AR</text><text x="366" y="228">DiT</text><text x="594" y="228">VAE</text><text x="822" y="228">Response</text></g><g font-size="13" fill="#506a7d" text-anchor="middle"><text x="138" y="254">Token / Conditioning</text><text x="366" y="254">Denoising Steps</text><text x="594" y="254">Latent → Pixel</text><text x="822" y="254">Serialize / Transfer</text></g><g stroke="#17896b" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M234 242H266"/><path d="M462 242H494"/><path d="M690 242H722"/></g><text x="481" y="372" text-anchor="middle" font-size="15" fill="#45657b">端到端 ≠ 各 GPU Kernel 耗时简单相加（可能存在 Overlap / Queue / Sync）<
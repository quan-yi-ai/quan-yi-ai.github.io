<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">PPO / GRPO：采样、估计与策略更新</title><desc id="desc">共同的数据主干不等于完全相同的组件、分组规则和目标函数。</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#456c7c" stroke-width="1.5"/></marker></defs><rect width="960" height="570" rx="16" fill="#fafcfd"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#1c3848"><text x="34" y="51" font-size="27" font-weight="700">PPO / GRPO：采样、估计与策略更新</text><text x="34" y="85" font-size="15" fill="#486573">共同的数据主干不等于完全相同的组件、分组规则和目标函数。</text><path d="M300 200H347" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M610 200H657" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M790 255V308.5H790V362" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M660 420H613" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M350 420H303" fill="none" stroke="#456c7c" stroke-width="2" marker-end="url(#a)"/><path d="M40 420H20V200H37" fill="none" stroke="#456c7c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="40" y="145" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="56" y="175" font-size="18" font-weight="650">Prompt</text><text x="56" y="203" font-size="14" fill="#365564">从任务分布取样</text><text x="56" y="226" font-size="14" fill="#365564">GRPO 按 Prompt 建立 Group</text><rect x="350" y="145" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="366" y="175" font-size="18" font-weight="650">Rollout</text><text x="366" y="203" font-size="14" fill="#365564">记录 Response 与行为策略版本</text><text x="366" y="226" font-size="14" fill="#365564">保留所需 Logprobs / Mask</text><rect x="660" y="145" width="260" height="110" rx="12" fill="#fbf1df" stroke="#b47d35" stroke-width="1.5"/><text x="676" y="175" font-size="18" font-weight="650">Reward</text><text x="676" y="203" font-size="14" fill="#365564">规则、环境或奖励模型</text><text x="676" y="226" font-size="14" fill="#365564">逐样本或逐阶段反馈</text><rect x="660" y="365" width="260" height="110" rx="12" fill="#f0eafa" stroke="#8d70ac" stroke-width="1.5"/><text x="676" y="395" font-size="18" font-weight="650">Advantage</text><text x="676" y="423" font-size="14" fill="#365564">PPO：Value / GAE</text><text x="676" y="446" font-size="14" fill="#365564">GRPO：组内相对奖励</text><rect x="350" y="365" width="260" height="110" rx="12" fill="#e7f4ee" stroke="#29856c" stroke-width="1.5"/><text x="366" y="395" font-size="18" font-weight="650">Actor / Critic Update</text><text x="366" y="423" font-size="14" fill="#365564">按算法构造 Loss 并更新</text><text x="366" y="446" font-size="14" fill="#365564">训练可包含多个 Mini-batch</text><rect x="40" y="365" width="260" height="110" rx="12" fill="#e9f0fa" stroke="#4c76a5" stroke-width="1.5"/><text x="56" y="395" font-size="18" font-weight="650">策略同步</text><text x="56" y="423" font-size="14" fill="#365564">发布推理权重与对应版本</text><text x="56" y="446" font-size="14" fill="#365564">再按同步 / 异步规则采样</text><text x="34" y="540" font-size="14" fill="#486573">Reference Logprob、Value 等可并行计算；图中展示逻辑依赖，不限定串行实现。</text></g></svg>
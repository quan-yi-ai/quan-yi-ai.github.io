<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="ttl desc"><title id="ttl">Ring Attention 沿设备环传递 KV 分片</title><desc id="desc">四张 GPU 组成环，各自保留本地 Query，KV 分片沿环传递；每一轮处理本地 Query 与收到的 KV 块并更新 Online Softmax 状态。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1822"/><stop offset="1" stop-color="#132830"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#85e6c1" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="430" rx="16" fill="url(#bg)"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="40" y="39" font-size="13" fill="#75e0c0" letter-spacing="2">CONTEXT PARALLELISM</text><text x="40" y="78" font-size="25" fill="#eafaf6" font-weight="750">Ring Attention：Query 留在本地，K/V 沿环交换</text><text x="40" y="108" font-size="14" fill="#9bbdc4">每轮处理一块可见 K/V，并使用 Online Softmax 合并当前 Query 的输出贡献。</text></g>
<g fill="#173a44" stroke="#599bab" stroke-width="1.6"><rect x="107" y="160" width="210" height="82" rx="12"/><rect x="448" y="160" width="210" height="82" rx="12"/><rect x="448" y="281" width="210" height="82" rx="12"/><rect x="107" y="281" width="210" height="82" rx="12"/></g>
<g fill="#e4faf7" font-family="system-ui, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle"><text x="212" y="188">GPU 0</text><text x="553" y="188">GPU 1</text><text x="553" y="309">GPU 2</text><text x="212" y="309">GPU 3</text></g>
<g fill="#8ee9cc" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle"><text x="212" y="217">Q0 · KV0</text><text x="553" y="217">Q1 · KV1</text><text x="553" y="338">Q2 · KV2</text><text x="212" y="338">Q3 · KV3</text></g>
<g stroke="#81d7bd" stroke-width="2.5" fill="none" marker-end="url(#arr)"><path d="M325 199H437"/><path d="M553 251V270"/><path d="M439 324H328"/><path d="M212 272V253"/></g>
<g fill="#8db5c0" font-family="system-ui, PingFang SC, sans-serif" font-size="13" text-anchor="middle"><text x="383" y="189">KV →</text><text x="383" y="347">← KV</text></g>
<rect x="743" y="174" width="293" height="188" rx="12" fill="#153c37" stroke="#55aa95" stroke-width="1.6"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="765" y="209" fill="#d4ffe9" font-size="18" font-weight="750">每轮本地计算</text><text x="765" y="239" fill="#a5decc" font-size="15">Scores = Q_local · K_tileᵀ</text><text x="765" y="273" fill="#e4f9f1" font-size="15">Online Softmax</text><text x="765" y="300" fill="#b2e2d4" font-size="14">更新 (m, ℓ, a)</text><text x="765" y="338" fill="#8fbdba" font-size="13">收齐所有 KV 贡献后输出 O_local</text></g>
<path d="M669 254H732" stroke="#80dcc0" stroke-width="2.3" fill="none" marker-end="url(#arr)"/>
<text x="40" y="407" fill="#8bb3bb" font-size="13" font-family="system-ui, PingFang SC, sans-serif">图示 4 卡通信方向；具体实现可重叠 KV 传输与 Attention 计算，并按 Mask 跳过无效块。</text>
</svg>
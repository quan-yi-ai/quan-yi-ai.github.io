<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="ttl desc"><title id="ttl">PagedAttention 逻辑 KV 块到物理内存的映射</title><desc id="desc">三个逻辑块由块表映射到不连续物理块；两个请求可共享只读前缀块。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1720"/><stop offset="1" stop-color="#142631"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6fdbbd" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="430" rx="16" fill="url(#bg)"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="36" y="38" font-size="13" letter-spacing="2" fill="#75e4c1">KV CACHE / MEMORY MANAGEMENT</text><text x="36" y="80" fill="#e8f8f4" font-size="25" font-weight="750">PagedAttention：逻辑块与物理块解耦</text><text x="36" y="106" fill="#9ebbc4" font-size="14">请求按逻辑顺序读取历史 KV，物理块可以分散存储；块表承担地址映射。</text></g>
<g fill="#e5f6f2" font-family="system-ui, PingFang SC, sans-serif" font-size="15" font-weight="700"><text x="51" y="162">逻辑 KV 块</text><text x="410" y="162">Block Table</text><text x="783" y="162">GPU 物理块</text></g>
<g stroke="#538a98" fill="#17343f" stroke-width="1.5"><rect x="40" y="181" width="265" height="163" rx="12"/><rect x="400" y="181" width="254" height="163" rx="12"/><rect x="763" y="181" width="276" height="163" rx="12"/></g>
<g font-family="ui-monospace, monospace" text-anchor="middle" font-size="14" font-weight="650"><rect x="58" y="214" width="71" height="48" rx="7" fill="#24544c" stroke="#71dbc0"/><rect x="138" y="214" width="71" height="48" rx="7" fill="#24544c" stroke="#71dbc0"/><rect x="218" y="214" width="71" height="48" rx="7" fill="#24544c" stroke="#71dbc0"/><g fill="#e8fff3"><text x="93" y="243">L0</text><text x="173" y="243">L1</text><text x="253" y="243">L2</text></g></g>
<text x="171" y="302" font-size="13" fill="#99c9c2" text-anchor="middle" font-family="system-ui, PingFang SC, sans-serif">请求内逻辑序列顺序</text>
<g fill="#193d44" stroke="#5fabad"><rect x="425" y="199" width="204" height="41" rx="7"/><rect x="425" y="247" width="204" height="41" rx="7"/><rect x="425" y="295" width="204" height="36" rx="7"/></g>
<g fill="#ddf7f3" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle"><text x="527" y="225">L0 → P5</text><text x="527" y="273">L1 → P1</text><text x="527" y="319">L2 → P7</text></g>
<g stroke="#70d5bd" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M310 238H392"/><path d="M657 263H747"/></g>
<g fill="#193b47" stroke="#528da3"><rect x="782" y="206" width="58" height="47" rx="6"/><rect x="848" y="206" width="58" height="47" rx="6"/><rect x="914" y="206" width="58" height="47" rx="6"/><rect x="980" y="206" width="40" height="47" rx="6"/><rect x="782" y="266" width="58" height="47" rx="6"/><rect x="848" y="266" width="58" height="47" rx="6"/><rect x="914" y="266" width="58" height="47" rx="6"/><rect x="980" y="266" width="40" height="47" rx="6"/></g>
<g fill="#e1f4ff" font-family="monospace" font-size="13" text-anchor="middle"><text x="811" y="234">P0</text><text x="877" y="234">P1</text><text x="943" y="234">P2</text><text x="1000" y="234">P3</text><text x="811" y="294">P4</text><text x="877" y="294">P5</text><text x="943" y="294">P6</text><text x="1000" y="294">P7</text></g>
<g fill="none" stroke="#85e6bd" stroke-width="2"><rect x="848" y="206" width="58" height="47" rx="6"/><rect x="848" y="266" width="58" height="47" rx="6"/><rect x="980" y="266" width="40" height="47" rx="6"/></g>
<line x1="36" y1="370" x2="1044" y2="370" stroke="#5a8a91" stroke-opacity=".4"/>
<text x="36" y="395" font-size="13" fill="#a6c0c5" font-family="system-ui, PingFang SC, sans-serif">示例映射：L0→P5、L1→P1、L2→P7；各物理块无需连续分配。</text>
</svg>
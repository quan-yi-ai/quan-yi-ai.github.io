<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="ttl desc">
<title id="ttl">Transformer Block 前向数据流</title><desc id="desc">输入 X 经过 Norm、Attention、残差、Norm、FFN 和残差，输出仍保持 B S H 形状。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#4583bd" stroke-width="1.6"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#4583bd" stroke-opacity=".08" fill="none"/></pattern></defs>
<rect width="1080" height="430" rx="16" fill="url(#bg)"/><rect width="1080" height="430" rx="16" fill="url(#grid)"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="36" y="40" fill="#087f55" font-size="13" font-weight="700" letter-spacing="2">TRANSFORMER BLOCK</text><text x="36" y="84" fill="#172d43" font-size="25" font-weight="750">单卡前向计算：Attention 与 FFN</text><text x="36" y="110" fill="#172d43" font-size="14">示例：Pre-Norm Transformer，残差旁路和层归一化都显式画出。</text></g>
<g fill="#def8e9" stroke="#4583bd" stroke-width="1.5"><rect x="30" y="192" width="119" height="68" rx="10"/><rect x="196" y="192" width="105" height="68" rx="10"/><rect x="350" y="192" width="155" height="68" rx="10"/><rect x="556" y="192" width="105" height="68" rx="10"/><rect x="709" y="192" width="119" height="68" rx="10"/><rect x="887" y="192" width="156" height="68" rx="10"/></g>
<g fill="#172d43" font-family="system-ui, PingFang SC, sans-serif" text-anchor="middle"><text x="90" y="220" font-size="16" font-weight="700">输入 X</text><text x="90" y="242" font-size="12">[B, S, H]</text><text x="249" y="233" font-size="17" font-weight="700">Norm</text><text x="428" y="220" font-size="18" font-weight="700">Attention</text><text x="428" y="243" font-size="12" fill="#087f55">混合 Token</text><text x="609" y="233" font-size="17" font-weight="700">Norm</text><text x="769" y="220" font-size="18" font-weight="700">FFN</text><text x="769" y="243" font-size="12" fill="#087f55">变换特征</text><text x="965" y="220" font-size="16" font-weight="700">输出 Y</text><text x="965" y="242" font-size="12">[B, S, H]</text></g>
<g stroke="#4583bd" stroke-width="2.3" fill="none" marker-end="url(#arr)"><path d="M151 226H190"/><path d="M303 226H343"/><path d="M507 226H550"/><path d="M663 226H703"/><path d="M831 226H881"/></g>
<g fill="none" stroke="#347dc8" stroke-width="2" stroke-dasharray="5 6"><path d="M149 206V156H528V206"/><path d="M548 206V143H857V206"/></g>
<g fill="#dfedff" stroke="#347dc8"><circle cx="528" cy="226" r="16" fill="#d8eee4"/><circle cx="858" cy="226" r="16" fill="#d8eee4"/></g>
<g fill="#172d43" font-size="18" font-family="sans-serif" text-anchor="middle"><text x="528" y="232">+</text><text x="858" y="232">+</text></g>
<g font-family="system-ui, PingFang SC, sans-serif" fill="#087f55" font-size="12"><text x="290" y="145" text-anchor="middle">Attention 残差</text><text x="700" y="131" text-anchor="middle">FFN 残差</text></g>
<line x1="36" y1="366" x2="1044" y2="366" stroke="#4583bd" stroke-opacity=".32"/>
<text x="36" y="391" fill="#172d43" font-size="13" font-family="system-ui, PingFang SC, sans-serif">X′ = X + Attention(Norm(X))</text><text x="575" y="391" fill="#172d43" font-size="13" font-family="system-ui, PingFang SC, sans-serif">Y = X′ + FFN(Norm(X′))</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <!-- layer boxes -->
  <g>
    <rect x="110" y="24"  width="420" height="72" rx="10" fill="#eef2ff" stroke="#7083d6"/>
    <text x="320" y="52"  text-anchor="middle" font-size="16" font-weight="600" fill="#2b3a67">④ RL 训练框架（slime / verl）</text>
    <text x="320" y="76"  text-anchor="middle" font-size="12.5" fill="#53607a">offload/release · onload/resume · update_weights</text>

    <rect x="110" y="134" width="420" height="72" rx="10" fill="#e9f6ef" stroke="#4fa877"/>
    <text x="320" y="162" text-anchor="middle" font-size="16" font-weight="600" fill="#1f5e3f">③ 推理框架（SGLang / vLLM）</text>
    <text x="320" y="186" text-anchor="middle" font-size="12.5" fill="#3f6b53">release/resume_memory_occupation · sleep/wake_up</text>

    <rect x="110" y="244" width="420" height="72" rx="10" fill="#fdf1e3" stroke="#d79a52"/>
    <text x="320" y="272" text-anchor="middle" font-size="16" font-weight="600" fill="#8a5a1b">② torch_memory_saver</text>
    <text x="320" y="296" text-anchor="middle" font-size="12.5" fill="#8a6a40">region / pause / resume → malloc / pause / resume</text>

    <rect x="110" y="354" width="420" height="72" rx="10" fill="#f0eefc" stroke="#9179c9"/>
    <text x="320" y="382" text-anchor="middle" font-size="16" font-weight="600" fill="#4b3a86">① PyTorch 可插拔分配器</text>
    <text x="320" y="406" text-anchor="middle" font-size="12.5" fill="#5f5192">CUDAPluggableAllocator + MemPool + use_mem_pool</text>

    <rect x="110" y="464" width="420" height="72" rx="10" fill="#edf0f2" stroke="#8a95a1"/>
    <text x="320" y="492" text-anchor="middle" font-size="16" font-weight="600" fill="#3a434e">CUDA Driver（VMM）</text>
    <text x="320" y="516" text-anchor="middle" font-size="12.5" fill="#555f6b">cuMemCreate / cuMemMap / cuMemUnmap / cuMemRelease</text>
  </g>

  <!-- down arrows -->
  <g stroke="#5b6472" stroke-width="1.6">
    <line x1="320" y1="96"  x2="320" y2="132" marker-end="url(#arrow)"/>
    <line x1="320" y1="206" x2="320" y2="242" marker-end="url(#arrow)"/>
    <line x1="320" y1="316" x2="320" y2="352" marker-end="url(#arrow)"/>
    <line x1="320" y1="426" x2="320" y2="462" marker-end="url(#arrow)"/>
  </g>
  <text x="336" y="120" font-size="11.5" fill="#53607a">按 tag 区分 weights / kv_cache</text>

  <!-- feedback dashed arrow: VMM -> TMS -->
  <path d="M530 500 C 690 470, 690 300, 560 282" fill="none" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <text x="602" y="392" text-anchor="middle" font-size="11.5" fill="#6b7686" transform="rotate(90 602 392)">物理显存可释放，虚拟地址保持不变</text>
</svg>

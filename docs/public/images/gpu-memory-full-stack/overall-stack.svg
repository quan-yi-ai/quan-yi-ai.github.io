<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">显存管理的两条调用路线</title><desc id="desc">SGLang 经由 TMS，vLLM 使用自身 CuMemAllocator；两条路线分别绑定分配回调并使用 CUDA VMM。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667488"/></marker></defs>
<rect width="900" height="650" rx="12" fill="#fff"/>
<g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#293a50"><text x="28" y="34" font-size="21" fill="#293a50" font-weight="650">从 RL 编排到 CUDA VMM：两条实现路线</text><rect x="170" y="58" width="560" height="78" rx="10" fill="#eef2ff" stroke="#8b9dc8"/><text x="188" y="87" font-size="16" fill="#293a50" font-weight="650">RL 框架：slime / verl</text><text x="188" y="112" font-size="13" fill="#293a50">按阶段调用 release / sleep、resume / wake、update_weights</text><path d="M450 136V158H240V180" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><path d="M450 158H660V180" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><rect x="45" y="182" width="390" height="80" rx="10" fill="#e9f6ef" stroke="#72aa8d"/><text x="63" y="211" font-size="16" fill="#293a50" font-weight="650">SGLang</text><text x="63" y="236" font-size="13" fill="#293a50">release / resume_memory_occupation</text><rect x="465" y="182" width="390" height="80" rx="10" fill="#f1edfc" stroke="#a38bc6"/><text x="483" y="211" font-size="16" fill="#293a50" font-weight="650">vLLM</text><text x="483" y="236" font-size="13" fill="#293a50">sleep / wake_up</text><path d="M240 262V297" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><path d="M660 262V297" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><rect x="45" y="299" width="390" height="96" rx="10" fill="#fdf1e3" stroke="#d5aa73"/><text x="63" y="328" font-size="16" fill="#293a50" font-weight="650">TMS adapter → torch_memory_saver</text><text x="63" y="353" font-size="13" fill="#293a50">region / pause / resume</text><text x="63" y="376" font-size="13" fill="#293a50">将分配登记到 TMS 管理范围</text><rect x="465" y="299" width="390" height="96" rx="10" fill="#f1edfc" stroke="#a38bc6"/><text x="483" y="328" font-size="16" fill="#293a50" font-weight="650">CuMemAllocator（vLLM 自身实现）</text><text x="483" y="353" font-size="13" fill="#293a50">use_memory_pool / sleep / wake_up</text><text x="483" y="376" font-size="13" fill="#293a50">不经过 torch_memory_saver</text><path d="M240 395V430" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><path d="M660 395V430" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><rect x="45" y="432" width="390" height="78" rx="10" fill="#edf4fb" stroke="#8eaac6"/><text x="63" y="461" font-size="15" fill="#293a50" font-weight="650">PyTorch 自定义分配路径</text><text x="63" y="486" font-size="13" fill="#293a50">torch 模式：MemPool → TMS malloc/free</text><rect x="465" y="432" width="390" height="78" rx="10" fill="#edf4fb" stroke="#8eaac6"/><text x="483" y="461" font-size="15" fill="#293a50" font-weight="650">PyTorch 自定义分配路径</text><text x="483" y="486" font-size="13" fill="#293a50">MemPool → vLLM 的分配/释放回调</text><path d="M240 510V534H450V554" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><path d="M660 510V534H450" fill="none" stroke="#667488" stroke-width="1.6" marker-end="url(#a)"/><rect x="170" y="556" width="560" height="68" rx="10" fill="#edf0f2" stroke="#98a3af"/><text x="188" y="585" font-size="16" fill="#293a50" font-weight="650">CUDA Driver VMM</text><text x="188" y="610" font-size="13" fill="#293a50">预留地址 · 创建物理资源 · 映射/解除映射 · 配置访问权限</text><text x="45" y="644" font-size="12" fill="#293a50">图中展开 torch 模式的分配入口；Preload 是另一种 Hook 接入方式。</text></g></svg>
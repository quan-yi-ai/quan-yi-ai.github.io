name: Test Feishu read-only API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Feishu API without publishing private content
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_NODE_TOKEN: W1jhwJs53ifE6RkhloOc3XtHnmg
        run: python scripts/check_feishu.py

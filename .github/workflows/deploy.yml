name: Deploy VitePress to GitHub Pages
# 图解配色统一完成：重新执行完整站点构建和发布验收

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check article images
        run: python scripts/check_article_images.py
      - name: Build VitePress
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: 记录构建和部署结果
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Verify deployed article image bytes
        if: needs.deploy.result == 'success'
        run: python scripts/check_article_images.py --live --output status/article_image_check.json
      - name: 保存部署结果到仓库
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, time, urllib.request
          live = {"checked": False, "page_kind": "unreachable"}
          for attempt in range(8):
            try:
              req = urllib.request.Request("https://quan-yi-ai.github.io/?check=" + os.environ["RUN_ID"], headers={"User-Agent": "ASB-Deployment-Check"})
              with urllib.request.urlopen(req, timeout=12) as response:
                html = response.read(200000).decode("utf-8", errors="replace")
                live = {
                  "checked": True,
                  "http_status": response.status,
                  "page_kind": "vitepress" if 'vitepress' in html.lower() and 'AI Systems' in html else ("readme" if "本地预览" in html and "docs:dev" in html else "other"),
                  "has_home_hero": "asb-hero" in html,
                }
              if live["page_kind"] == "vitepress": break
            except Exception as exc:
              live = {"checked": False, "page_kind": "unreachable", "error_type": type(exc).__name__}
            time.sleep(5)
          # Validate that the migrated article and its genuine SVG asset are
          # published as well; never confuse a successful homepage with all pages.
          try:
            article_url = "https://quan-yi-ai.github.io/posts/transformer-parallel-attention?check=" + os.environ["RUN_ID"]
            with urllib.request.urlopen(urllib.request.Request(article_url, headers={"User-Agent": "ASB-Deployment-Check"}), timeout=15) as response:
              article_html = response.read(400000).decode("utf-8", errors="replace")
              live["article_http_status"] = response.status
              live["article_original_title"] = "并行方式" in article_html
              live["article_reading_layout"] = "asb-story-header" in article_html
            diagram_url = "https://quan-yi-ai.github.io/diagrams/parallel-overview.svg"
            with urllib.request.urlopen(diagram_url, timeout=15) as response:
              diagram = response.read(100000).decode("utf-8", errors="replace")
              live["svg_http_status"] = response.status
              live["svg_is_vector"] = "<svg" in diagram and "<image" not in diagram and "data:image" not in diagram
          except Exception as exc:
            live["article_check_error"] = type(exc).__name__
          # Additional validation for the TransferQueue foundation article.
          try:
            url = "https://quan-yi-ai.github.io/posts/transferqueue?check=" + os.environ["RUN_ID"]
            with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"ASB-Deployment-Check"}), timeout=15) as response:
              page = response.read(500000).decode("utf-8", errors="replace")
              live["transferqueue_http_status"] = response.status
              live["transferqueue_article_present"] = "TransferQueue" in page and "asb-story-header" in page
              live["transferqueue_figure_count"] = page.count('class="asb-zoom-trigger"')
            diagram_url = "https://quan-yi-ai.github.io/diagrams/tq-figure-1.svg"
            with urllib.request.urlopen(diagram_url, timeout=15) as response:
              svg = response.read(100000).decode("utf-8", errors="replace")
              live["transferqueue_svg_vector"] = response.status == 200 and "<svg" in svg and "<image" not in svg and "base64," not in svg
          except Exception as exc:
            live["transferqueue_check_error"] = type(exc).__name__
          # Verify editorial revisions are visible on all four published articles.
          article_checks = {
            "ray": ("ray-distributed-framework", "Ray Dashboard 与分布式故障排查"),
            "transferqueue": ("transferqueue", "PUT / GET 请求的完整执行路径"),
            "rust": ("transferqueue-python-cpp-rust", "Controller 性能测试与结果分析"),
            "parallel": ("transformer-parallel-attention", "多维并行进程组与通信成本"),
          }
          live["editorial_pages"] = {}
          for key, (slug, heading) in article_checks.items():
            try:
              url = "https://quan-yi-ai.github.io/posts/" + slug + "?editorial=" + os.environ["RUN_ID"]
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"ASB-Deployment-Check"}), timeout=15) as response:
                page = response.read(600000).decode("utf-8", errors="replace")
                live["editorial_pages"][key] = {
                  "http_status": response.status,
                  "updated_heading": heading in page,
                  "old_editorial_heading_absent": "不要背菜单，而要学会定位故障" not in page,
                  "figure_count": page.count('class="asb-zoom-trigger"'),
                }
            except Exception as exc:
              live["editorial_pages"][key] = {"error": type(exc).__name__}
          # Confirm every newly migrated public article is accessible.
          migrated_slugs = [
            "python-concurrency-runtime",
            "python-functions-context",
            "rlinf-architecture",
            "minicpmo-45-omni-inference",
            "rl-posttraining-frameworks",
            "agentic-rl-infrastructure",
            "gpu-memory-vmm-tms-offload",
            "pytorch-compiler-illustrated",
            "speculative-decoding-guide",
            "rlkernel-moe-router-consistency",
            "multimodal-generation-benchmark",
            "sglang-startup-log-analysis",
          ]
          live["migrated_articles"] = {}
          for slug in migrated_slugs:
            try:
              article_url = "https://quan-yi-ai.github.io/posts/" + slug + "?review=" + os.environ["RUN_ID"]
              with urllib.request.urlopen(urllib.request.Request(article_url, headers={"User-Agent":"ASB-Deployment-Check"}), timeout=20) as response:
                body = response.read(700000).decode("utf-8", errors="replace")
                live["migrated_articles"][slug] = {
                  "status": response.status,
                  "article_header": "asb-story-header" in body,
                  "figures": body.count('class="asb-zoom-trigger"'),
                }
            except Exception as exc:
              live["migrated_articles"][slug] = {"error": type(exc).__name__}
          live["migrated_articles_all_ok"] = all(
            x.get("status") == 200 and x.get("article_header")
            for x in live["migrated_articles"].values()
          )
          result = {
            "live_site": live,
            "run_id": os.environ["RUN_ID"],
            "source_sha": os.environ["SOURCE_SHA"],
            "build": os.environ["BUILD_RESULT"],
            "deploy": os.environ["DEPLOY_RESULT"],
            "result": "success" if os.environ["BUILD_RESULT"] == "success" and os.environ["DEPLOY_RESULT"] == "success" else "failure"
          }
          Path("status").mkdir(exist_ok=True)
          Path("status/pages_deploy.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/pages_deploy.json
          if [ -f status/article_image_check.json ]; then git add status/article_image_check.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "记录 Pages 部署状态 [skip ci]"
            git pull --rebase origin main
            git push
          fi

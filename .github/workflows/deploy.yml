name: Deploy VitePress to GitHub Pages
# Pages 已切换为 GitHub Actions，重新触发站点发布

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build VitePress
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: 记录构建和部署结果
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: 保存部署结果到仓库
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          result = {
            "run_id": os.environ["RUN_ID"],
            "source_sha": os.environ["SOURCE_SHA"],
            "build": os.environ["BUILD_RESULT"],
            "deploy": os.environ["DEPLOY_RESULT"],
            "result": "success" if os.environ["BUILD_RESULT"] == "success" and os.environ["DEPLOY_RESULT"] == "success" else "failure"
          }
          Path("status").mkdir(exist_ok=True)
          Path("status/pages_deploy.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/pages_deploy.json
          if ! git diff --cached --quiet; then
            git commit -m "记录 Pages 部署状态 [skip ci]"
            git pull --rebase origin main
            git push
          fi
